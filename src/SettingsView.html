<div class="page-head">
  <div>
    <h1 class="page-title">Settings</h1>
    <p class="page-sub">Fuel cost build-up, default trip expenses, and margin used to quote a trip.</p>
  </div>
</div>

<div class="card">
  <form id="settings-form">
    <h3>Fuel</h3>
    <div class="form-grid">
      <div class="field">
        <label for="settings-fuel-price">
          Fuel price per litre
          <span class="hint">What you currently pay per litre of fuel</span>
        </label>
        <input id="settings-fuel-price" type="number" min="0" step="0.01" required>
      </div>
      <div class="field">
        <label for="settings-fuel-consumption">
          Fuel consumption (litres per km)
          <span class="hint">Round-trip average for the delivery truck, e.g. 0.4 = 40L/100km</span>
        </label>
        <input id="settings-fuel-consumption" type="number" min="0" step="0.001" required>
      </div>
      <div class="field">
        <label>
          Fuel rate per km (calculated)
          <span class="hint">Price per litre &times; consumption &mdash; not directly editable</span>
        </label>
        <input id="settings-fuel-rate-preview" type="text" disabled>
      </div>
    </div>

    <h3 style="margin-top:20px;">Default Trip Expenses</h3>
    <div class="form-grid">
      <div class="field">
        <label for="settings-toll">Default toll fee</label>
        <input id="settings-toll" type="number" min="0" step="0.01" required>
      </div>
      <div class="field">
        <label for="settings-zrp">Default ZRP fee</label>
        <input id="settings-zrp" type="number" min="0" step="0.01" required>
      </div>
      <div class="field">
        <label for="settings-vid">Default VID fee</label>
        <input id="settings-vid" type="number" min="0" step="0.01" required>
      </div>
    </div>

    <h3 style="margin-top:20px;">Pricing</h3>
    <div class="form-grid">
      <div class="field">
        <label for="settings-margin">
          Company margin (%)
          <span class="hint">Applied on top of fuel cost + trip expenses to produce the client quote</span>
        </label>
        <input id="settings-margin" type="number" min="0" step="0.1" required>
      </div>
      <div class="field">
        <label for="settings-currency">Currency symbol</label>
        <input id="settings-currency" type="text" maxlength="4" required>
      </div>
    </div>

    <button type="submit" class="btn primary" id="settings-submit">Save settings</button>
    <div class="msg" id="settings-msg"></div>
  </form>
</div>
