<style>
  :root {
    --brick: #b6461f;
    --ink: #1f2933;
    --bg: #f7f5f2;
    --card: #ffffff;
    --border: #e2e0dc;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    padding: 24px 16px 48px;
  }
  .app { max-width: 480px; margin: 0 auto; }
  header { margin-bottom: 24px; }
  h1 { margin: 0; color: var(--brick); font-size: 1.5rem; }
  .subtitle { margin: 4px 0 0; color: var(--muted); }
  form {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  label {
    display: block;
    font-size: 0.875rem;
    font-weight: 600;
    margin-bottom: 14px;
  }
  input {
    display: block;
    width: 100%;
    margin-top: 6px;
    padding: 10px 12px;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-weight: 400;
  }
  fieldset {
    border: 1px solid var(--border);
    border-radius: 8px;
    margin: 0 0 14px;
    padding: 12px;
  }
  legend { font-size: 0.8rem; color: var(--muted); padding: 0 4px; }
  .actions { display: flex; gap: 12px; margin-top: 8px; }
  button {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    font-weight: 600;
    cursor: pointer;
  }
  #save-btn { background: var(--brick); color: #fff; border-color: var(--brick); }
  button:disabled { opacity: 0.6; cursor: default; }
  .error {
    background: #fdecea;
    color: #b3261e;
    border: 1px solid #f5c6c3;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 14px;
    font-size: 0.875rem;
  }
  .breakdown, .saved-banner {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-top: 16px;
  }
  .breakdown h2 { margin: 0 0 12px; font-size: 1.1rem; }
  .breakdown dl { margin: 0; display: grid; grid-template-columns: 1fr auto; row-gap: 8px; }
  .breakdown dt { color: var(--muted); }
  .breakdown dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .total { font-weight: 700; color: var(--ink); border-top: 1px solid var(--border); padding-top: 8px; margin-top: 4px; }
  .saved-banner { background: #eaf7ee; border-color: #bfe6c9; color: #1e6b34; font-weight: 600; }
</style>
