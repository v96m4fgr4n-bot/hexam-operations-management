<div class="page-head">
  <div>
    <h1 class="page-title">New Trip</h1>
    <p class="page-sub">Quote a delivery trip for a client.</p>
  </div>
</div>

<div class="card">
  <form id="trip-form">
    <div class="form-grid">
      <div class="field">
        <label for="trip-client">Client</label>
        <select id="trip-client" required></select>
      </div>
      <div class="field">
        <label for="trip-destination">Destination</label>
        <input id="trip-destination" type="text" placeholder="e.g. Chinhoyi site" required>
      </div>
      <div class="field">
        <label for="trip-distance">
          One-way distance (km)
          <span class="hint">Manual for now &mdash; Google Maps distance lookup is planned</span>
        </label>
        <input id="trip-distance" type="number" min="0.01" step="0.01" required>
      </div>
    </div>

    <h3 style="margin-top:20px;">Trip Expenses</h3>
    <div class="form-grid">
      <div class="field">
        <label for="trip-toll">Toll fee</label>
        <input id="trip-toll" type="number" min="0" step="0.01">
      </div>
      <div class="field">
        <label for="trip-zrp">ZRP fee</label>
        <input id="trip-zrp" type="number" min="0" step="0.01">
      </div>
      <div class="field">
        <label for="trip-vid">VID fee</label>
        <input id="trip-vid" type="number" min="0" step="0.01">
      </div>
    </div>

    <div class="form-grid">
      <div class="field">
        <label for="trip-other-desc">Other fee description (optional)</label>
        <input id="trip-other-desc" type="text" placeholder="e.g. weighbridge fee">
      </div>
      <div class="field">
        <label for="trip-other-amount">Other fee amount</label>
        <input id="trip-other-amount" type="number" min="0" step="0.01" value="0">
      </div>
    </div>

    <h3 style="margin-top:20px;">Load Bringer (optional)</h3>
    <div class="form-grid">
      <div class="field">
        <label for="trip-load-bringer">
          Referred by
          <span class="hint">If this load came from someone who referred it to us, the load levy is added to the client's total and paid out to them</span>
        </label>
        <select id="trip-load-bringer">
          <option value="">None</option>
        </select>
      </div>
    </div>

    <div class="field full">
      <label for="trip-notes">Notes (optional)</label>
      <textarea id="trip-notes"></textarea>
    </div>

    <button type="button" class="btn ghost" id="trip-discount-toggle">+ Add discount</button>
    <div class="form-grid" id="trip-discount-fields" hidden style="margin-top:12px;">
      <div class="field">
        <label for="trip-discount-amount">Discount amount</label>
        <input id="trip-discount-amount" type="number" min="0" step="0.01" value="0">
      </div>
      <div class="field">
        <label for="trip-discount-reason">Reason (optional)</label>
        <input id="trip-discount-reason" type="text" placeholder="e.g. repeat client">
      </div>
    </div>

    <div class="cost-summary" id="trip-cost-summary">
      <div class="line subtle"><span>Round-trip distance</span><span id="cs-distance">-</span></div>
      <div class="line subtle"><span>Fuel rate per km (price/litre &divide; consumption)</span><span id="cs-fuel-rate">-</span></div>
      <div class="line"><span>Fuel cost</span><span id="cs-fuel">-</span></div>
      <div class="line"><span>Trip expenses (toll + ZRP + VID + other)</span><span id="cs-expenses">-</span></div>
      <div class="divider"></div>
      <div class="line subtle"><span>Subtotal</span><span id="cs-subtotal">-</span></div>
      <div class="line"><span id="cs-margin-label">Margin</span><span id="cs-margin">-</span></div>
      <div class="line" id="cs-levy-row" hidden><span id="cs-levy-label">Load levy</span><span id="cs-levy">-</span></div>
      <div class="line subtle" id="cs-before-discount-row" hidden><span>Total before discount</span><span id="cs-before-discount">-</span></div>
      <div class="line" id="cs-discount-row" hidden><span>Discount</span><span id="cs-discount">-</span></div>
      <div class="line total"><span>Quote total</span><span id="cs-total">-</span></div>
    </div>

    <button type="submit" class="btn primary" id="trip-submit">Save trip</button>
    <div class="msg" id="trip-msg"></div>
  </form>
</div>
