<script>
  var STATE = {
    settings: null, clients: [], loadBringers: [], editingClientId: null, editingLoadBringerId: null,
    trucks: [], editingTruckId: null, editingTrailerId: null, editingDriverId: null
  };

  function $(id) { return document.getElementById(id); }

  function escapeHtml(s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function money(n) {
    var symbol = (STATE.settings && STATE.settings.currencySymbol) || '$';
    return symbol + Number(n || 0).toFixed(2);
  }

  function showMsg(el, text, isError) {
    el.textContent = text;
    el.className = 'msg ' + (isError ? 'error' : 'success');
  }

  function clearMsg(el) {
    el.textContent = '';
    el.className = 'msg';
  }

  /* ---------- Modals ---------- */

  function openModal(id) { $(id).classList.add('open'); }
  function closeModal(id) { $(id).classList.remove('open'); }

  document.querySelectorAll('.modal-overlay').forEach(function (overlay) {
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) closeModal(overlay.id);
    });
  });

  /* ---------- Sidebar navigation ---------- */

  function setView(viewName) {
    document.querySelectorAll('.modal-overlay.open').forEach(function (m) { closeModal(m.id); });
    document.querySelectorAll('.nav-item').forEach(function (item) {
      item.classList.toggle('active', item.getAttribute('data-view') === viewName);
    });
    document.querySelectorAll('.view').forEach(function (view) {
      view.classList.toggle('active', view.id === 'view-' + viewName);
    });
    closeSidebar();

    if (viewName === 'dashboard') loadDashboard();
    if (viewName === 'trip-history') loadTripHistory();
    if (viewName === 'clients') loadClients();
    if (viewName === 'load-bringers') loadLoadBringers();
    if (viewName === 'accounting') loadAccounting();
    if (viewName === 'trends') loadTrends();
    if (viewName === 'fleet') loadFleet();
    if (viewName === 'audit-log') loadAuditLog();
  }

  function openSidebar() {
    $('sidebar').classList.add('open');
    $('sidebar-backdrop').classList.add('open');
  }

  function closeSidebar() {
    $('sidebar').classList.remove('open');
    $('sidebar-backdrop').classList.remove('open');
  }

  document.querySelectorAll('.nav-item').forEach(function (item) {
    item.addEventListener('click', function () { setView(item.getAttribute('data-view')); });
    item.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setView(item.getAttribute('data-view')); }
    });
  });

  $('burger').addEventListener('click', openSidebar);
  $('sidebar-backdrop').addEventListener('click', closeSidebar);

  /* ---------- Bootstrap ---------- */

  function loadInitialData() {
    google.script.run.withSuccessHandler(function (settings) {
      STATE.settings = settings;
      populateSettingsForm(settings);
      prefillTripFeesFromSettings();
      updateTripPreview();
    }).withFailureHandler(function (err) {
      showMsg($('trip-msg'), err.message || String(err), true);
    }).getSettings();

    loadClientsForTripForm();
    loadLoadBringersForTripForm();
    loadDriversForTripForm();
    loadDashboard();
  }

  /* ---------- Settings ---------- */

  function populateSettingsForm(settings) {
    $('settings-fuel-price').value = settings.fuelPricePerLitre;
    $('settings-fuel-consumption').value = settings.fuelConsumptionKmPerL;
    $('settings-fuel-rate-preview').value = fuelRatePreview_(settings.fuelPricePerLitre, settings.fuelConsumptionKmPerL);
    $('settings-currency').value = settings.currencySymbol;
    $('settings-toll').value = settings.defaultTollFee;
    $('settings-zrp').value = settings.defaultZrpFee;
    $('settings-vid').value = settings.defaultVidFee;
    $('settings-margin').value = settings.companyMarginPercent;
    $('settings-load-levy').value = settings.loadLevyAmount;
    $('settings-brick-price').value = settings.brickPricePer1000;
    updateBrickPriceHint_();
  }

  function updateBrickPriceHint_() {
    if (!STATE.settings) return;
    $('trip-brick-price-hint').textContent = 'Priced at ' + money(STATE.settings.brickPricePer1000) + ' per 1000';
  }

  function fuelRatePreview_(price, consumption) {
    if (!(consumption > 0)) return '-';
    return money(price / consumption) + ' / km';
  }

  ['settings-fuel-price', 'settings-fuel-consumption'].forEach(function (id) {
    $(id).addEventListener('input', function () {
      var price = Number($('settings-fuel-price').value) || 0;
      var consumption = Number($('settings-fuel-consumption').value) || 0;
      $('settings-fuel-rate-preview').value = fuelRatePreview_(price, consumption);
    });
  });

  $('settings-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('settings-submit');
    var msg = $('settings-msg');
    clearMsg(msg);
    btn.disabled = true;

    google.script.run.withSuccessHandler(function (result) {
      btn.disabled = false;
      STATE.settings = result.settings;
      populateSettingsForm(result.settings);
      showMsg(msg, 'Settings saved.', false);
      updateTripPreview();
      prefillTripFeesFromSettings();
    }).withFailureHandler(function (err) {
      btn.disabled = false;
      showMsg(msg, err.message || String(err), true);
    }).updateSettings({
      fuelPricePerLitre: Number($('settings-fuel-price').value),
      fuelConsumptionKmPerL: Number($('settings-fuel-consumption').value),
      currencySymbol: $('settings-currency').value,
      defaultTollFee: Number($('settings-toll').value),
      defaultZrpFee: Number($('settings-zrp').value),
      defaultVidFee: Number($('settings-vid').value),
      companyMarginPercent: Number($('settings-margin').value),
      loadLevyAmount: Number($('settings-load-levy').value),
      brickPricePer1000: Number($('settings-brick-price').value)
    });
  });

  /* ---------- Dashboard ---------- */

  function loadDashboard() {
    google.script.run.withSuccessHandler(renderDashboard).withFailureHandler(function (err) {
      $('dash-sub').textContent = err.message || String(err);
    }).getDashboardSummary();
  }

  function renderDashboard(s) {
    $('dash-sub').textContent = 'Live figures, updated automatically as trips are saved.';

    $('dash-today-revenue').textContent = money(s.todayRevenue);
    $('dash-today-profit').textContent = money(s.todayProfit);
    $('dash-today-profit').className = 'stat-value ' + (s.todayProfit >= 0 ? 'positive' : 'negative');
    $('dash-today-trips').textContent = s.todayTripCount;

    $('dash-month-revenue').textContent = money(s.monthRevenue);
    $('dash-month-profit').textContent = money(s.monthProfit);
    $('dash-month-profit').className = 'stat-value ' + (s.monthProfit >= 0 ? 'positive' : 'negative');
    $('dash-month-trips').textContent = s.monthTripCount;

    $('dash-avg-quote').textContent = money(s.averageQuoteValue);
    $('dash-active-clients').textContent = s.activeClientCount;
    $('dash-active-bringers').textContent = s.activeLoadBringerCount;

    var wrap = $('dash-recent-wrap');
    if (!s.recentTrips.length) {
      wrap.innerHTML = '<div class="empty-state">No trips yet.</div>';
      return;
    }
    var rows = s.recentTrips.map(function (t) {
      return '<tr>' +
        '<td>' + new Date(t.tripDate).toLocaleDateString() + '</td>' +
        '<td>' + escapeHtml(t.clientName) + '</td>' +
        '<td>' + escapeHtml(t.destination) + '</td>' +
        '<td><strong>' + money(t.totalCost) + '</strong></td>' +
        '</tr>';
    }).join('');
    wrap.innerHTML = '<table><thead><tr><th>Date</th><th>Client</th><th>Destination</th><th>Quote</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }

  /* ---------- Clients ---------- */

  function loadClientsForTripForm() {
    google.script.run.withSuccessHandler(function (clients) {
      STATE.clients = clients;
      $('trip-client-datalist').innerHTML = clients
        .map(function (c) { return '<option value="' + escapeHtml(c.name) + '">'; }).join('');
    }).withFailureHandler(function (err) {
      showMsg($('trip-msg'), err.message || String(err), true);
    }).getClients(false);
  }

  function loadClients() {
    var wrap = $('clients-table-wrap');
    google.script.run.withSuccessHandler(function (clients) {
      if (!clients.length) {
        wrap.innerHTML = '<div class="empty-state">No clients yet. Add one above.</div>';
        return;
      }
      var rows = clients.map(function (c) {
        return '<tr>' +
          '<td>' + escapeHtml(c.name) + '</td>' +
          '<td>' + escapeHtml(c.contactPerson) + '</td>' +
          '<td>' + escapeHtml(c.phone) + '</td>' +
          '<td>' + escapeHtml(c.email) + '</td>' +
          '<td><span class="badge ' + (c.active ? 'ok' : 'neutral') + '">' + (c.active ? 'Active' : 'Inactive') + '</span></td>' +
          '<td>' +
            '<button class="btn sm ghost" data-edit="' + escapeHtml(c.id) + '">Edit</button> ' +
            (c.active
              ? '<button class="btn sm danger" data-deactivate="' + escapeHtml(c.id) + '">Deactivate</button>'
              : '<button class="btn sm" data-reactivate="' + escapeHtml(c.id) + '">Reactivate</button>') +
          '</td>' +
          '</tr>';
      }).join('');
      wrap.innerHTML = '<table><thead><tr><th>Name</th><th>Contact</th><th>Phone</th><th>Email</th><th>Status</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>';

      wrap.querySelectorAll('[data-edit]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var client = clients.filter(function (c) { return c.id === btn.getAttribute('data-edit'); })[0];
          if (client) startEditClient(client);
        });
      });
      wrap.querySelectorAll('[data-deactivate]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (!confirm('Deactivate this client? Past trips are kept.')) return;
          setClientActive_(btn.getAttribute('data-deactivate'), 'deactivateClient');
        });
      });
      wrap.querySelectorAll('[data-reactivate]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          setClientActive_(btn.getAttribute('data-reactivate'), 'reactivateClient');
        });
      });
    }).withFailureHandler(function (err) {
      wrap.innerHTML = '<div class="empty-state">' + escapeHtml(err.message || String(err)) + '</div>';
    }).getClients(true);
  }

  function setClientActive_(clientId, fnName) {
    google.script.run.withSuccessHandler(function () {
      loadClients();
      loadClientsForTripForm();
    }).withFailureHandler(function (err) {
      alert(err.message || String(err));
    })[fnName](clientId);
  }

  function startEditClient(client) {
    STATE.editingClientId = client.id;
    $('client-form-title').textContent = 'Edit client';
    $('client-id').value = client.id;
    $('client-name').value = client.name;
    $('client-contact').value = client.contactPerson;
    $('client-phone').value = client.phone;
    $('client-email').value = client.email;
    $('client-address').value = client.address;
    $('client-submit').textContent = 'Save changes';
    $('client-cancel-edit').hidden = false;
    $('client-form').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function resetClientForm() {
    STATE.editingClientId = null;
    $('client-form-title').textContent = 'Add client';
    $('client-form').reset();
    $('client-id').value = '';
    $('client-submit').textContent = 'Add client';
    $('client-cancel-edit').hidden = true;
  }

  $('client-cancel-edit').addEventListener('click', resetClientForm);

  $('client-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('client-submit');
    var msg = $('client-msg');
    clearMsg(msg);
    btn.disabled = true;

    var clientData = {
      name: $('client-name').value,
      contactPerson: $('client-contact').value,
      phone: $('client-phone').value,
      email: $('client-email').value,
      address: $('client-address').value
    };

    var onDone = function () {
      btn.disabled = false;
      showMsg(msg, STATE.editingClientId ? 'Client updated.' : 'Client added.', false);
      resetClientForm();
      loadClients();
      loadClientsForTripForm();
    };
    var onFail = function (err) {
      btn.disabled = false;
      showMsg(msg, err.message || String(err), true);
    };

    if (STATE.editingClientId) {
      google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail)
        .updateClient(STATE.editingClientId, clientData);
    } else {
      google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail)
        .addClient(clientData);
    }
  });

  /* ---------- Load Bringers ---------- */

  function loadLoadBringersForTripForm() {
    google.script.run.withSuccessHandler(function (bringers) {
      STATE.loadBringers = bringers;
      $('trip-load-bringer-datalist').innerHTML = bringers
        .map(function (b) { return '<option value="' + escapeHtml(b.name) + '">'; }).join('');
    }).withFailureHandler(function (err) {
      showMsg($('trip-msg'), err.message || String(err), true);
    }).getLoadBringers(false);
  }

  function loadLoadBringers() {
    var wrap = $('bringers-table-wrap');
    google.script.run.withSuccessHandler(function (bringers) {
      if (!bringers.length) {
        wrap.innerHTML = '<div class="empty-state">No load bringers yet. Add one above.</div>';
        return;
      }
      var rows = bringers.map(function (b) {
        return '<tr>' +
          '<td>' + escapeHtml(b.name) + '</td>' +
          '<td>' + escapeHtml(b.phone) + '</td>' +
          '<td><span class="badge ' + (b.active ? 'ok' : 'neutral') + '">' + (b.active ? 'Active' : 'Inactive') + '</span></td>' +
          '<td>' + b.tripCount + '</td>' +
          '<td><strong>' + money(b.totalPaid) + '</strong></td>' +
          '<td>' +
            '<button class="btn sm ghost" data-edit="' + escapeHtml(b.id) + '">Edit</button> ' +
            (b.active
              ? '<button class="btn sm danger" data-deactivate="' + escapeHtml(b.id) + '">Deactivate</button>'
              : '<button class="btn sm" data-reactivate="' + escapeHtml(b.id) + '">Reactivate</button>') +
          '</td>' +
          '</tr>';
      }).join('');
      wrap.innerHTML = '<table><thead><tr><th>Name</th><th>Phone</th><th>Status</th><th>Loads brought</th><th>Total paid</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>';

      wrap.querySelectorAll('[data-edit]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var bringer = bringers.filter(function (b) { return b.id === btn.getAttribute('data-edit'); })[0];
          if (bringer) startEditLoadBringer(bringer);
        });
      });
      wrap.querySelectorAll('[data-deactivate]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (!confirm('Deactivate this load bringer? Past trips are kept.')) return;
          setLoadBringerActive_(btn.getAttribute('data-deactivate'), 'deactivateLoadBringer');
        });
      });
      wrap.querySelectorAll('[data-reactivate]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          setLoadBringerActive_(btn.getAttribute('data-reactivate'), 'reactivateLoadBringer');
        });
      });
    }).withFailureHandler(function (err) {
      wrap.innerHTML = '<div class="empty-state">' + escapeHtml(err.message || String(err)) + '</div>';
    }).getLoadBringerSummary();
  }

  function setLoadBringerActive_(loadBringerId, fnName) {
    google.script.run.withSuccessHandler(function () {
      loadLoadBringers();
      loadLoadBringersForTripForm();
    }).withFailureHandler(function (err) {
      alert(err.message || String(err));
    })[fnName](loadBringerId);
  }

  function startEditLoadBringer(bringer) {
    STATE.editingLoadBringerId = bringer.id;
    $('bringer-form-title').textContent = 'Edit load bringer';
    $('bringer-id').value = bringer.id;
    $('bringer-name').value = bringer.name;
    $('bringer-phone').value = bringer.phone;
    $('bringer-submit').textContent = 'Save changes';
    $('bringer-cancel-edit').hidden = false;
    $('bringer-form').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function resetLoadBringerForm() {
    STATE.editingLoadBringerId = null;
    $('bringer-form-title').textContent = 'Add load bringer';
    $('bringer-form').reset();
    $('bringer-id').value = '';
    $('bringer-submit').textContent = 'Add load bringer';
    $('bringer-cancel-edit').hidden = true;
  }

  $('bringer-cancel-edit').addEventListener('click', resetLoadBringerForm);

  $('bringer-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('bringer-submit');
    var msg = $('bringer-msg');
    clearMsg(msg);
    btn.disabled = true;

    var bringerData = {
      name: $('bringer-name').value,
      phone: $('bringer-phone').value
    };

    var onDone = function () {
      btn.disabled = false;
      showMsg(msg, STATE.editingLoadBringerId ? 'Load bringer updated.' : 'Load bringer added.', false);
      resetLoadBringerForm();
      loadLoadBringers();
      loadLoadBringersForTripForm();
    };
    var onFail = function (err) {
      btn.disabled = false;
      showMsg(msg, err.message || String(err), true);
    };

    if (STATE.editingLoadBringerId) {
      google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail)
        .updateLoadBringer(STATE.editingLoadBringerId, bringerData);
    } else {
      google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail)
        .addLoadBringer(bringerData);
    }
  });

  /* ---------- New Trip ---------- */

  function loadDriversForTripForm() {
    google.script.run.withSuccessHandler(function (drivers) {
      var select = $('trip-driver');
      var current = select.value;
      select.innerHTML = '<option value="">No driver assigned</option>' +
        drivers.map(function (d) { return '<option value="' + escapeHtml(d.id) + '">' + escapeHtml(d.name) + '</option>'; }).join('');
      select.value = current;
    }).withFailureHandler(function (err) {
      showMsg($('trip-msg'), err.message || String(err), true);
    }).getDrivers(false);
  }

  function prefillTripFeesFromSettings() {
    if (!STATE.settings) return;
    $('trip-toll').value = STATE.settings.defaultTollFee;
    $('trip-zrp').value = STATE.settings.defaultZrpFee;
    $('trip-vid').value = STATE.settings.defaultVidFee;
  }

  $('trip-client-name').addEventListener('input', function () {
    var typed = this.value.trim().toLowerCase();
    var match = STATE.clients.filter(function (c) { return c.name.trim().toLowerCase() === typed; })[0];
    var hint = $('trip-client-match-hint');
    if (!typed) {
      hint.textContent = 'Type a name — matches an existing client, or adds a new one';
    } else if (match) {
      hint.textContent = 'Existing client' + (match.phone ? ' — phone on file: ' + match.phone : '');
      if (match.phone && !$('trip-client-phone').value) {
        $('trip-client-phone').value = match.phone;
      }
    } else {
      hint.textContent = 'New client — will be added to the client list when this trip is saved';
    }
  });

  $('trip-order-type').addEventListener('change', function () {
    var showBricks = this.value === 'Transport + Bricks';
    $('trip-brick-qty-field').hidden = !showBricks;
    if (!showBricks) $('trip-brick-quantity').value = '';
    updateTripPreview();
  });

  $('trip-discount-toggle').addEventListener('click', function () {
    var fields = $('trip-discount-fields');
    var showing = !fields.hidden;
    if (showing) {
      $('trip-discount-amount').value = 0;
      $('trip-discount-reason').value = '';
    }
    fields.hidden = showing;
    this.textContent = showing ? '+ Add discount' : '- Remove discount';
    updateTripPreview();
  });

  function updateTripPreview() {
    if (!STATE.settings) return;
    var distance = Number($('trip-distance').value) || 0;
    var toll = Number($('trip-toll').value) || 0;
    var zrp = Number($('trip-zrp').value) || 0;
    var vid = Number($('trip-vid').value) || 0;
    var other = Number($('trip-other-amount').value) || 0;
    var loadBringerName = $('trip-load-bringer-name').value.trim();
    var discountShown = !$('trip-discount-fields').hidden;
    var discount = discountShown ? (Number($('trip-discount-amount').value) || 0) : 0;

    var roundTrip = distance * 2;
    var fuelRate = STATE.settings.fuelConsumptionKmPerL > 0
      ? STATE.settings.fuelPricePerLitre / STATE.settings.fuelConsumptionKmPerL
      : 0;
    var fuelCost = roundTrip * fuelRate;
    var tripExpenses = toll + zrp + vid + other;
    var subtotal = fuelCost + tripExpenses;
    var marginPercent = STATE.settings.companyMarginPercent;
    var marginAmount = subtotal * marginPercent / 100;
    var orderType = $('trip-order-type').value;
    var brickQuantity = Number($('trip-brick-quantity').value) || 0;
    var brickCost = orderType === 'Transport + Bricks' ? (brickQuantity / 1000) * STATE.settings.brickPricePer1000 : 0;
    var levyAmount = loadBringerName ? STATE.settings.loadLevyAmount : 0;
    var totalBeforeDiscount = subtotal + marginAmount + brickCost + levyAmount;
    var total = totalBeforeDiscount - discount;

    $('cs-distance').textContent = roundTrip.toFixed(2) + ' km';
    $('cs-fuel-rate').textContent = money(fuelRate) + ' / km';
    $('cs-fuel').textContent = money(fuelCost);
    $('cs-expenses').textContent = money(tripExpenses);
    $('cs-subtotal').textContent = money(subtotal);
    $('cs-margin-label').textContent = 'Margin (' + marginPercent + '%)';
    $('cs-margin').textContent = money(marginAmount);

    $('cs-bricks-row').hidden = orderType !== 'Transport + Bricks';
    if (orderType === 'Transport + Bricks') {
      $('cs-bricks-label').textContent = 'Bricks (' + brickQuantity + ' @ ' + money(STATE.settings.brickPricePer1000) + '/1000)';
      $('cs-bricks').textContent = money(brickCost);
    }

    $('cs-levy-row').hidden = !loadBringerName;
    if (loadBringerName) {
      $('cs-levy-label').textContent = 'Load levy (' + loadBringerName + ')';
      $('cs-levy').textContent = money(levyAmount);
    }

    $('cs-before-discount-row').hidden = !(discount > 0);
    if (discount > 0) $('cs-before-discount').textContent = money(totalBeforeDiscount);
    $('cs-discount-row').hidden = !(discount > 0);
    if (discount > 0) $('cs-discount').textContent = '−' + money(discount);

    $('cs-total').textContent = money(total);

    var otherExpenseDesc = $('trip-expense-desc').value.trim();
    var otherExpenseAmount = otherExpenseDesc ? (Number($('trip-expense-amount').value) || 0) : 0;
    var noteEl = $('cs-expense-note');
    if (otherExpenseAmount > 0) {
      noteEl.textContent = 'Not billed to the client, but this trip’s tracked profit will be reduced by ' + money(otherExpenseAmount) + ' for: ' + otherExpenseDesc;
      noteEl.className = 'msg warn';
    } else {
      noteEl.className = 'msg';
    }
  }

  ['trip-distance', 'trip-toll', 'trip-zrp', 'trip-vid', 'trip-other-amount', 'trip-brick-quantity', 'trip-expense-desc', 'trip-expense-amount', 'trip-load-bringer-name', 'trip-discount-amount'].forEach(function (id) {
    $(id).addEventListener('input', updateTripPreview);
    $(id).addEventListener('change', updateTripPreview);
  });

  $('trip-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('trip-submit');
    var msg = $('trip-msg');
    clearMsg(msg);

    if (!$('trip-client-name').value.trim()) {
      showMsg(msg, 'Enter a client name before quoting a trip.', true);
      return;
    }

    btn.disabled = true;

    var discountShown = !$('trip-discount-fields').hidden;

    google.script.run.withSuccessHandler(function (result) {
      btn.disabled = false;
      showMsg(msg, 'Trip saved - quote total ' + money(result.trip.totalCost) + '.', false);
      $('trip-form').reset();
      $('trip-brick-qty-field').hidden = true;
      $('trip-discount-fields').hidden = true;
      $('trip-discount-toggle').textContent = '+ Add discount';
      $('trip-client-match-hint').textContent = 'Type a name — matches an existing client, or adds a new one';
      prefillTripFeesFromSettings();
      updateTripPreview();
      loadClientsForTripForm();
      loadLoadBringersForTripForm();

      var invoiceBtn = $('trip-invoice-btn');
      invoiceBtn.hidden = false;

  /* ---------- Trip History ---------- */

  function loadTripHistory() {
    var wrap = $('history-table-wrap');
    var sub = $('history-sub');
    google.script.run.withSuccessHandler(function (trips) {
      sub.textContent = trips.length + ' trip' + (trips.length === 1 ? '' : 's') + ' quoted.';
      if (!trips.length) {
        wrap.innerHTML = '<div class="empty-state">No trips quoted yet.</div>';
        return;
      }
      var rows = trips.map(function (t) {
        var net = t.marginAmount + t.brickCost - t.discountAmount - t.otherExpenseAmount;
        var marginPct = t.totalCost > 0 ? (net / t.totalCost * 100) : 0;
        var profitBadge = '<span class="badge ' + (net >= 0 ? 'ok' : 'danger') + '">' +
          (net >= 0 ? '+' + money(net) : '−' + money(Math.abs(net))) + ' (' + marginPct.toFixed(1) + '%)</span>';

        var paymentBadge;
        if (!(t.amountPaid > 0)) {
          paymentBadge = '<span class="badge neutral">Not recorded</span>';
        } else if (t.amountPaid + 0.005 < t.totalCost) {
          paymentBadge = '<span class="badge warn">' + money(t.amountPaid) + ' partial</span>';
        } else {
          paymentBadge = '<span class="badge ok">' + money(t.amountPaid) + ' paid</span>';
        }

        return '<tr>' +
          '<td>' + new Date(t.tripDate).toLocaleDateString() + '</td>' +
          '<td>' + escapeHtml(t.clientName) + '</td>' +
          '<td>' + escapeHtml(t.destination) + '</td>' +
          '<td>' + (t.driverName ? escapeHtml(t.driverName) : '&mdash;') + '</td>' +
          '<td>' + t.roundTripDistanceKm.toFixed(2) + ' km</td>' +
          '<td>' + money(t.fuelCost) + '</td>' +
          '<td>' + money(t.tripExpenses) + '</td>' +
          '<td>' + money(t.marginAmount) + ' (' + t.marginPercent + '%)</td>' +
          '<td>' + (t.loadBringerName ? escapeHtml(t.loadBringerName) + ' (' + money(t.loadLevyAmount) + ')' : '&mdash;') + '</td>' +
          '<td>' + (t.otherExpenseAmount > 0 ? escapeHtml(t.otherExpenseDescription) + ' (' + money(t.otherExpenseAmount) + ')' : '&mdash;') + '</td>' +
          '<td>' + (t.discountAmount > 0 ? '−' + money(t.discountAmount) : '&mdash;') + '</td>' +
          '<td>' + profitBadge + '</td>' +
          '<td><strong>' + money(t.totalCost) + '</strong></td>' +
          '<td>' + paymentBadge + '</td>' +
          '<td>' +
            '<button class="btn sm ghost" data-invoice="' + escapeHtml(t.tripId) + '">Invoice</button> ' +
            '<button class="btn sm ghost" data-pay="' + escapeHtml(t.tripId) + '" data-total="' + t.totalCost + '" data-paid="' + t.amountPaid + '">Record payment</button>' +
          '</td>' +
          '</tr>';
      }).join('');
      wrap.innerHTML = '<table><thead><tr><th>Date</th><th>Client</th><th>Destination</th><th>Driver</th><th>Round trip</th><th>Fuel</th><th>Expenses</th><th>Margin</th><th>Load bringer (levy)</th><th>Other expense (unbilled)</th><th>Discount</th><th>Profit</th><th>Quote</th><th>Payment</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>';

      wrap.querySelectorAll('[data-invoice]').forEach(function (btn) {
        btn.addEventListener('click', function () { downloadInvoice_(btn.getAttribute('data-invoice'), btn); });
      });
      wrap.querySelectorAll('[data-pay]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          recordPayment_(btn.getAttribute('data-pay'), Number(btn.getAttribute('data-total')), Number(btn.getAttribute('data-paid')), btn);
        });

      wrap.innerHTML = '<div class="empty-state">' + escapeHtml(err.message || String(err)) + '</div>';

  /* ---------- Payment recording ---------- */

  function recordPayment_(tripId, quoteTotal, currentPaid, btn) {
    var suggested = currentPaid > 0 ? currentPaid : quoteTotal;
    var input = prompt('Amount actually paid for this trip (the quote total was ' + money(quoteTotal) + '):', suggested.toFixed(2));
    if (input === null) return;
    var amount = Number(input);
    if (!isFinite(amount) || isNaN(amount) || amount < 0) {
      alert('Enter a valid amount that is zero or greater.');
      return;
    }

    btn.disabled = true;
    google.script.run.withSuccessHandler(function () {
      btn.disabled = false;
      loadTripHistory();
    }).withFailureHandler(function (err) {
      btn.disabled = false;
      alert(err.message || String(err));
    }).recordTripPayment(tripId, amount);
  }

  /* ---------- Invoice download ---------- */

  function downloadInvoice_(tripId, btn) {
    var originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Preparing…';

    google.script.run.withSuccessHandler(function (result) {
      btn.disabled = false;
      btn.textContent = originalText;

      var byteChars = atob(result.base64);
      var byteNumbers = new Array(byteChars.length);
      for (var i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
      var blob = new Blob([new Uint8Array(byteNumbers)], { type: result.mimeType });
      var url = URL.createObjectURL(blob);

      var a = document.createElement('a');
      a.href = url;
      a.download = result.fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }).withFailureHandler(function (err) {
      btn.disabled = false;
      btn.textContent = originalText;
      alert(err.message || String(err));
    }).downloadTripInvoice(tripId);
  }

  /** Two bars per day (revenue, profit), rounded corners, a thin stroke so the
   *  shape reads even at low fill-vs-background contrast, and a value label
   *  on the most recent day only. */
  function svgDualBars_(days, keyA, keyB) {
    var w = 700, barAreaH = 150, h = barAreaH + 26;
    var maxVal = Math.max(1, Math.max.apply(null, days.map(function (d) { return Math.max(d[keyA], d[keyB]); })));
    var slotW = w / days.length;
    var barW = Math.max(4, Math.min(14, slotW / 2 - 3));

    var svg = '<svg class="chart-svg" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="Revenue and profit, last 14 days">';
    svg += '<line x1="0" y1="' + barAreaH + '" x2="' + w + '" y2="' + barAreaH + '" stroke="var(--line-strong)" stroke-width="1"/>';

    days.forEach(function (d, i) {
      var cx = i * slotW + slotW / 2;
      var aH = Math.max(1, Math.round((d[keyA] / maxVal) * (barAreaH - 14)));
      var bH = Math.max(1, Math.round((d[keyB] / maxVal) * (barAreaH - 14)));
      var isLast = i === days.length - 1;

      svg += barRect_(cx - barW - 1, barAreaH - aH, barW, aH, 'var(--brand-blue)', d.label + ': ' + money(d[keyA]) + ' revenue');
      svg += barRect_(cx + 1, barAreaH - bH, barW, bH, 'var(--brand-orange)', d.label + ': ' + money(d[keyB]) + ' profit');

      if (isLast) {
        svg += svgText_(cx, barAreaH - Math.max(aH, bH) - 6, money(d[keyA]), 'var(--ink-2)');
      }
      if (i % 2 === 0 || isLast) {
        svg += svgText_(cx, barAreaH + 16, d.label, 'var(--ink-4)');
      }
    });

    return svg + '</svg>';
  }

  /** One bar per day. */
  function svgSingleBars_(days, key, color, formatFn) {
    var w = 700, barAreaH = 120, h = barAreaH + 26;
    var maxVal = Math.max(1, Math.max.apply(null, days.map(function (d) { return d[key]; })));
    var slotW = w / days.length;
    var barW = Math.max(6, Math.min(20, slotW - 6));

    var svg = '<svg class="chart-svg" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="Daily trend">';
    svg += '<line x1="0" y1="' + barAreaH + '" x2="' + w + '" y2="' + barAreaH + '" stroke="var(--line-strong)" stroke-width="1"/>';

    days.forEach(function (d, i) {
      var cx = i * slotW + slotW / 2;
      var barH = Math.max(1, Math.round((d[key] / maxVal) * (barAreaH - 14)));
      var isLast = i === days.length - 1;

      svg += barRect_(cx - barW / 2, barAreaH - barH, barW, barH, color, d.label + ': ' + formatFn(d[key]));
      if (isLast) svg += svgText_(cx, barAreaH - barH - 6, formatFn(d[key]), 'var(--ink-2)');
      if (i % 2 === 0 || isLast) svg += svgText_(cx, barAreaH + 16, d.label, 'var(--ink-4)');
    });

    return svg + '</svg>';
  }

  /** Horizontal ranked bars - label + value always shown directly, since a
   *  ranked list reads as numbers as much as shape. */
  function svgRankedBars_(items, valueKey, labelKey, formatFn, color) {
    var w = 700, rowH = 28, h = items.length * rowH + 8;
    var maxVal = Math.max(1, Math.max.apply(null, items.map(function (it) { return it[valueKey]; })));
    var labelW = 170, barAreaW = w - labelW - 70;

    var svg = '<svg class="chart-svg" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="Ranked totals">';
    items.forEach(function (it, i) {
      var y = i * rowH + 6;
      var barW = Math.max(2, Math.round((it[valueKey] / maxVal) * barAreaW));
      svg += '<text x="' + (labelW - 8) + '" y="' + (y + 13) + '" text-anchor="end" font-size="11" fill="var(--ink-1)">' + escapeHtml(it[labelKey]) + '</text>';
      svg += barRect_(labelW, y, barW, 16, color, it[labelKey] + ': ' + formatFn(it[valueKey]));
      svg += '<text x="' + (labelW + barW + 6) + '" y="' + (y + 13) + '" font-size="11" fill="var(--ink-2)">' + escapeHtml(formatFn(it[valueKey])) + '</text>';
    });

    return svg + '</svg>';
  }

  function barRect_(x, y, w, h, color, titleText) {
    return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="2" ' +
      'fill="' + color + '" stroke="var(--ink-2)" stroke-width="0.5">' +
      '<title>' + escapeHtml(titleText) + '</title></rect>';
  }

  function svgText_(x, y, text, color) {
    return '<text x="' + x + '" y="' + y + '" text-anchor="middle" font-size="9" fill="' + color + '">' + escapeHtml(text) + '</text>';
  }

  /** Server sends Dates as strings; this normalizes to yyyy-MM-dd for a
   *  date input. Assumes a positive UTC offset (this business is in
   *  Africa/Harare, UTC+2), so a date-only ISO string parsed as UTC
   *  midnight never shifts back a day in the browser's local time. */
  function toDateInputValue_(v) {
    if (!v) return '';
    var d = new Date(v);
    if (isNaN(d.getTime())) return '';
    var mm = String(d.getMonth() + 1).padStart(2, '0');
    var dd = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + mm + '-' + dd;
  }

  function dateBadge_(status, dateValue) {
    var dateStr = dateValue ? new Date(dateValue).toLocaleDateString() : 'Not set';
    if (!status) return '<span class="badge neutral">Not set</span>';
    var cls = status === 'expired' ? 'danger' : (status === 'due-soon' ? 'warn' : 'ok');
    var label = status === 'expired' ? 'Expired' : (status === 'due-soon' ? 'Due soon' : 'OK');
    return '<span class="badge ' + cls + '">' + label + '</span> ' + escapeHtml(dateStr);
  }

  function fleetStatusBadge_(status) {
    var cls = status === 'Active' ? 'ok' : (status === 'In Repair' ? 'warn' : 'danger');
    return '<span class="badge ' + cls + '">' + escapeHtml(status) + '</span>';
  }

    btn.disabled = true;

    var data = {
      regNumber: $('truck-reg').value,
      roadworthyExpiry: $('truck-roadworthy').value,
      nextServiceDue: $('truck-service').value,
      status: $('truck-status').value
    };

    var onDone = function () {
      btn.disabled = false;
      showMsg(msg, STATE.editingTruckId ? 'Truck updated.' : 'Truck added.', false);
      resetTruckForm();
      loadTrucks();
    };
    var onFail = function (err) { btn.disabled = false; showMsg(msg, err.message || String(err), true); };

    if (STATE.editingTruckId) {
      google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).updateTruck(STATE.editingTruckId, data);
    } else {
      google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).addTruck(data);
    }
  });

  /* ----- Trailers ----- */

  function loadTrailers() {
    var wrap = $('trailers-table-wrap');
    google.script.run.withSuccessHandler(function (trailers) {
      if (!trailers.length) {
        wrap.innerHTML = '<div class="empty-state">No trailers yet.</div>';
        return;
      }
      var rows = trailers.map(function (t) {
        return '<tr>' +
          '<td>' + escapeHtml(t.regNumber) + '</td>' +
          '<td>' + dateBadge_(t.roadworthyStatus, t.roadworthyExpiry) + '</td>' +
          '<td>' + dateBadge_(t.serviceStatus, t.nextServiceDue) + '</td>' +
          '<td>' + fleetStatusBadge_(t.status) + '</td>' +
          '<td><button class="btn sm ghost" data-edit="' + escapeHtml(t.id) + '">Edit</button></td>' +
          '</tr>';
      }).join('');
      wrap.innerHTML = '<table><thead><tr><th>Reg</th><th>Roadworthy</th><th>Service due</th><th>Status</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>';

      wrap.querySelectorAll('[data-edit]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var trailer = trailers.filter(function (t) { return t.id === btn.getAttribute('data-edit'); })[0];
          if (trailer) startEditTrailer(trailer);
        });
      });
    }).withFailureHandler(function (err) {
      wrap.innerHTML = '<div class="empty-state">' + escapeHtml(err.message || String(err)) + '</div>';
    }).getTrailers();
  }

  function startEditTrailer(trailer) {
    STATE.editingTrailerId = trailer.id;
    $('trailer-form-title').textContent = 'Edit trailer';
    $('trailer-id').value = trailer.id;
    $('trailer-reg').value = trailer.regNumber;
    $('trailer-roadworthy').value = toDateInputValue_(trailer.roadworthyExpiry);
    $('trailer-service').value = toDateInputValue_(trailer.nextServiceDue);
    $('trailer-status').value = trailer.status;
    $('trailer-submit').textContent = 'Save changes';
    $('trailer-cancel-edit').hidden = false;
    openModal('trailer-modal');
  }

  function resetTrailerForm() {
    STATE.editingTrailerId = null;
    $('trailer-form-title').textContent = 'Add trailer';
    $('trailer-form').reset();
    $('trailer-id').value = '';
    $('trailer-status').value = 'Active';
    $('trailer-submit').textContent = 'Add trailer';
    $('trailer-cancel-edit').hidden = true;
    closeModal('trailer-modal');
  }

  $('trailer-add-btn').addEventListener('click', function () {
    resetTrailerForm();
    openModal('trailer-modal');
  });

  $('trailer-modal-close').addEventListener('click', resetTrailerForm);
  $('trailer-cancel-edit').addEventListener('click', resetTrailerForm);

  $('trailer-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('trailer-submit');
    var msg = $('trailer-msg');
    clearMsg(msg);
    btn.disabled = true;

    var data = {
      regNumber: $('trailer-reg').value,
      roadworthyExpiry: $('trailer-roadworthy').value,
      nextServiceDue: $('trailer-service').value,
      status: $('trailer-status').value
    };

    var onDone = function () {
      btn.disabled = false;
      showMsg(msg, STATE.editingTrailerId ? 'Trailer updated.' : 'Trailer added.', false);
      resetTrailerForm();
      loadTrailers();
    };
    var onFail = function (err) { btn.disabled = false; showMsg(msg, err.message || String(err), true); };

    if (STATE.editingTrailerId) {
      google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).updateTrailer(STATE.editingTrailerId, data);
    } else {
      google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).addTrailer(data);
    }
  });

  /* ----- Drivers ----- */

  function loadDrivers() {
    var wrap = $('drivers-table-wrap');
    google.script.run.withSuccessHandler(function (drivers) {
      if (!drivers.length) {
        wrap.innerHTML = '<div class="empty-state">No drivers yet.</div>';
        return;
      }
      var truckRegById = {};
      STATE.trucks.forEach(function (t) { truckRegById[t.id] = t.regNumber; });

      var rows = drivers.map(function (d) {
        return '<tr>' +
          '<td>' + escapeHtml(d.name) + '</td>' +
          '<td>' + escapeHtml(d.phone) + '</td>' +
          '<td>' + (d.assignedTruckId ? escapeHtml(truckRegById[d.assignedTruckId] || d.assignedTruckId) : '&mdash;') + '</td>' +
          '<td><span class="badge ' + (d.active ? 'ok' : 'neutral') + '">' + (d.active ? 'Active' : 'Inactive') + '</span></td>' +
          '<td>' +
            '<button class="btn sm ghost" data-edit="' + escapeHtml(d.id) + '">Edit</button> ' +
            (d.active
              ? '<button class="btn sm danger" data-deactivate="' + escapeHtml(d.id) + '">Deactivate</button>'
              : '<button class="btn sm" data-reactivate="' + escapeHtml(d.id) + '">Reactivate</button>') +
          '</td>' +
          '</tr>';
      }).join('');
      wrap.innerHTML = '<table><thead><tr><th>Name</th><th>Phone</th><th>Truck</th><th>Status</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>';

      wrap.querySelectorAll('[data-edit]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var driver = drivers.filter(function (d) { return d.id === btn.getAttribute('data-edit'); })[0];
          if (driver) startEditDriver(driver);
        });
      });
      wrap.querySelectorAll('[data-deactivate]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (!confirm('Deactivate this driver?')) return;
          setDriverActive_(btn.getAttribute('data-deactivate'), 'deactivateDriver');
        });
      });
      wrap.querySelectorAll('[data-reactivate]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          setDriverActive_(btn.getAttribute('data-reactivate'), 'reactivateDriver');
        });
      });
    }).withFailureHandler(function (err) {
      wrap.innerHTML = '<div class="empty-state">' + escapeHtml(err.message || String(err)) + '</div>';
    }).getDrivers(true);
  }

  function setDriverActive_(driverId, fnName) {
    google.script.run.withSuccessHandler(function () {
      loadDrivers();
      loadTrucks();
      loadDriversForTripForm();
    }).withFailureHandler(function (err) {
      alert(err.message || String(err));
    })[fnName](driverId);
  }

  function startEditDriver(driver) {
    STATE.editingDriverId = driver.id;
    $('driver-form-title').textContent = 'Edit driver';
    $('driver-id').value = driver.id;
    $('driver-name').value = driver.name;
    $('driver-phone').value = driver.phone;
    $('driver-truck').value = driver.assignedTruckId || '';
    $('driver-submit').textContent = 'Save changes';
    $('driver-cancel-edit').hidden = false;
    openModal('driver-modal');
  }

  function resetDriverForm() {
    STATE.editingDriverId = null;
    $('driver-form-title').textContent = 'Add driver';
    $('driver-form').reset();
    $('driver-id').value = '';
    $('driver-submit').textContent = 'Add driver';
    $('driver-cancel-edit').hidden = true;
    closeModal('driver-modal');
  }

  $('driver-add-btn').addEventListener('click', function () {
    resetDriverForm();
    openModal('driver-modal');
  });

  $('driver-modal-close').addEventListener('click', resetDriverForm);
  $('driver-cancel-edit').addEventListener('click', resetDriverForm);

  $('driver-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('driver-submit');
    var msg = $('driver-msg');
    clearMsg(msg);
    btn.disabled = true;

    var data = {
      name: $('driver-name').value,
      phone: $('driver-phone').value,
      assignedTruckId: $('driver-truck').value
    };

    var onDone = function () {
      btn.disabled = false;
      showMsg(msg, STATE.editingDriverId ? 'Driver updated.' : 'Driver added.', false);
      resetDriverForm();
      loadDrivers();
      loadTrucks();
      loadDriversForTripForm();
    };
    var onFail = function (err) { btn.disabled = false; showMsg(msg, err.message || String(err), true); };

    if (STATE.editingDriverId) {
      google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).updateDriver(STATE.editingDriverId, data);
    } else {
      google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).addDriver(data);
    }
  });

  /* ---------- Audit Log ---------- */

  function loadAuditLog() {
    var wrap = $('audit-table-wrap');
    var entityType = $('audit-filter').value;
    google.script.run.withSuccessHandler(function (entries) {
      if (!entries.length) {
        wrap.innerHTML = '<div class="empty-state">No activity recorded yet.</div>';
        return;
      }
      var rows = entries.map(function (e) {
        return '<tr>' +
          '<td>' + new Date(e.timestamp).toLocaleString() + '</td>' +
          '<td>' + escapeHtml(e.userEmail) + '</td>' +
          '<td>' + escapeHtml(e.action) + '</td>' +
          '<td>' + escapeHtml(e.entityType) + '</td>' +
          '<td>' + escapeHtml(e.summary) + '</td>' +
          '</tr>';
      }).join('');
      wrap.innerHTML = '<table><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Type</th><th>Details</th></tr></thead><tbody>' + rows + '</tbody></table>';
    }).withFailureHandler(function (err) {
      wrap.innerHTML = '<div class="empty-state">' + escapeHtml(err.message || String(err)) + '</div>';
    }).getAuditLog({ entityType: entityType, limit: 200 });
  }

  $('audit-filter').addEventListener('change', loadAuditLog);

  loadInitialData();
</script>
