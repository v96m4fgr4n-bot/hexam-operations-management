<script>
  var STATE = { settings: null, clients: [], editingClientId: null, editingLoadBringerId: null };

  function $(id) { return document.getElementById(id); }

  function escapeHtml(s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function money(n) {
    var symbol = (STATE.settings && STATE.settings.currencySymbol) || '$';
    return symbol + Number(n || 0).toFixed(2);
  }

  function showMsg(el, text, isError) {
    el.textContent = text;
    el.className = 'msg ' + (isError ? 'error' : 'success');
  }

  function clearMsg(el) {
    el.textContent = '';
    el.className = 'msg';
  }

  /* ---------- Sidebar navigation ---------- */

  function setView(viewName) {
    document.querySelectorAll('.nav-item').forEach(function (item) {
      item.classList.toggle('active', item.getAttribute('data-view') === viewName);
    });
    document.querySelectorAll('.view').forEach(function (view) {
      view.classList.toggle('active', view.id === 'view-' + viewName);
    });
    closeSidebar();

    if (viewName === 'dashboard') loadDashboard();
    if (viewName === 'trip-history') loadTripHistory();
    if (viewName === 'clients') loadClients();
    if (viewName === 'load-bringers') loadLoadBringers();
    if (viewName === 'accounting') loadAccounting();
    if (viewName === 'trends') loadTrends();
  }

  function openSidebar() {
    $('sidebar').classList.add('open');
    $('sidebar-backdrop').classList.add('open');
  }

  function closeSidebar() {
    $('sidebar').classList.remove('open');
    $('sidebar-backdrop').classList.remove('open');
  }

  document.querySelectorAll('.nav-item').forEach(function (item) {
    item.addEventListener('click', function () { setView(item.getAttribute('data-view')); });
    item.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setView(item.getAttribute('data-view')); }
    });
  });

  $('burger').addEventListener('click', openSidebar);
  $('sidebar-backdrop').addEventListener('click', closeSidebar);

  /* ---------- Bootstrap ---------- */

  function loadInitialData() {
    google.script.run.withSuccessHandler(function (settings) {
      STATE.settings = settings;
      populateSettingsForm(settings);
      prefillTripFeesFromSettings();
      updateTripPreview();
    }).withFailureHandler(function (err) {
      showMsg($('trip-msg'), err.message || String(err), true);
    }).getSettings();

    loadClientsForTripForm();
    loadLoadBringersForTripForm();
    loadDashboard();
  }

  /* ---------- Settings ---------- */

  function populateSettingsForm(settings) {
    $('settings-fuel-price').value = settings.fuelPricePerLitre;
    $('settings-fuel-consumption').value = settings.fuelConsumptionKmPerL;
    $('settings-fuel-rate-preview').value = fuelRatePreview_(settings.fuelPricePerLitre, settings.fuelConsumptionKmPerL);
    $('settings-currency').value = settings.currencySymbol;
    $('settings-toll').value = settings.defaultTollFee;
    $('settings-zrp').value = settings.defaultZrpFee;
    $('settings-vid').value = settings.defaultVidFee;
    $('settings-margin').value = settings.companyMarginPercent;
    $('settings-load-levy').value = settings.loadLevyAmount;
  }

  function fuelRatePreview_(price, consumption) {
    if (!(consumption > 0)) return '-';
    return money(price / consumption) + ' / km';
  }

  ['settings-fuel-price', 'settings-fuel-consumption'].forEach(function (id) {
    $(id).addEventListener('input', function () {
      var price = Number($('settings-fuel-price').value) || 0;
      var consumption = Number($('settings-fuel-consumption').value) || 0;
      $('settings-fuel-rate-preview').value = fuelRatePreview_(price, consumption);
    });
  });

  $('settings-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('settings-submit');
    var msg = $('settings-msg');
    clearMsg(msg);
    btn.disabled = true;

    google.script.run.withSuccessHandler(function (result) {
      btn.disabled = false;
      STATE.settings = result.settings;
      populateSettingsForm(result.settings);
      showMsg(msg, 'Settings saved.', false);
      updateTripPreview();
      prefillTripFeesFromSettings();
    }).withFailureHandler(function (err) {
      btn.disabled = false;
      showMsg(msg, err.message || String(err), true);
    }).updateSettings({
      fuelPricePerLitre: Number($('settings-fuel-price').value),
      fuelConsumptionKmPerL: Number($('settings-fuel-consumption').value),
      currencySymbol: $('settings-currency').value,
      defaultTollFee: Number($('settings-toll').value),
      defaultZrpFee: Number($('settings-zrp').value),
      defaultVidFee: Number($('settings-vid').value),
      companyMarginPercent: Number($('settings-margin').value),
      loadLevyAmount: Number($('settings-load-levy').value)
    });
  });

  /* ---------- Dashboard ---------- */

  function loadDashboard() {
    google.script.run.withSuccessHandler(renderDashboard).withFailureHandler(function (err) {
      $('dash-sub').textContent = err.message || String(err);
    }).getDashboardSummary();
  }

  function renderDashboard(s) {
    $('dash-sub').textContent = 'Live figures, updated automatically as trips are saved.';

    $('dash-today-revenue').textContent = money(s.todayRevenue);
    $('dash-today-profit').textContent = money(s.todayProfit);
    $('dash-today-trips').textContent = s.todayTripCount;

    $('dash-month-revenue').textContent = money(s.monthRevenue);
    $('dash-month-profit').textContent = money(s.monthProfit);
    $('dash-month-trips').textContent = s.monthTripCount;

    $('dash-avg-quote').textContent = money(s.averageQuoteValue);
    $('dash-active-clients').textContent = s.activeClientCount;
    $('dash-active-bringers').textContent = s.activeLoadBringerCount;

    var wrap = $('dash-recent-wrap');
    if (!s.recentTrips.length) {
      wrap.innerHTML = '<div class="empty-state">No trips yet.</div>';
      return;
    }
    var rows = s.recentTrips.map(function (t) {
      return '<tr>' +
        '<td>' + new Date(t.tripDate).toLocaleDateString() + '</td>' +
        '<td>' + escapeHtml(t.clientName) + '</td>' +
        '<td>' + escapeHtml(t.destination) + '</td>' +
        '<td><strong>' + money(t.totalCost) + '</strong></td>' +
        '</tr>';
    }).join('');
    wrap.innerHTML = '<table><thead><tr><th>Date</th><th>Client</th><th>Destination</th><th>Quote</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }

  /* ---------- Clients ---------- */

  function loadClientsForTripForm() {
    google.script.run.withSuccessHandler(function (clients) {
      STATE.clients = clients;
      $('trip-client-datalist').innerHTML = clients
        .map(function (c) { return '<option value="' + escapeHtml(c.name) + '">'; }).join('');
    }).withFailureHandler(function (err) {
      showMsg($('trip-msg'), err.message || String(err), true);
    }).getClients(false);
  }

  function loadClients() {
    var wrap = $('clients-table-wrap');
    google.script.run.withSuccessHandler(function (clients) {
      if (!clients.length) {
        wrap.innerHTML = '<div class="empty-state">No clients yet. Add one above.</div>';
        return;
      }
      var rows = clients.map(function (c) {
        return '<tr>' +
          '<td>' + escapeHtml(c.name) + '</td>' +
          '<td>' + escapeHtml(c.contactPerson) + '</td>' +
          '<td>' + escapeHtml(c.phone) + '</td>' +
          '<td>' + escapeHtml(c.email) + '</td>' +
          '<td><span class="badge ' + (c.active ? 'ok' : 'neutral') + '">' + (c.active ? 'Active' : 'Inactive') + '</span></td>' +
          '<td>' +
            '<button class="btn sm ghost" data-edit="' + escapeHtml(c.id) + '">Edit</button> ' +
            (c.active
              ? '<button class="btn sm danger" data-deactivate="' + escapeHtml(c.id) + '">Deactivate</button>'
              : '<button class="btn sm" data-reactivate="' + escapeHtml(c.id) + '">Reactivate</button>') +
          '</td>' +
          '</tr>';
      }).join('');
      wrap.innerHTML = '<table><thead><tr><th>Name</th><th>Contact</th><th>Phone</th><th>Email</th><th>Status</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>';

      wrap.querySelectorAll('[data-edit]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var client = clients.filter(function (c) { return c.id === btn.getAttribute('data-edit'); })[0];
          if (client) startEditClient(client);
        });
      });
      wrap.querySelectorAll('[data-deactivate]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (!confirm('Deactivate this client? Past trips are kept.')) return;
          setClientActive_(btn.getAttribute('data-deactivate'), 'deactivateClient');
        });
      });
      wrap.querySelectorAll('[data-reactivate]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          setClientActive_(btn.getAttribute('data-reactivate'), 'reactivateClient');
        });
      });
    }).withFailureHandler(function (err) {
      wrap.innerHTML = '<div class="empty-state">' + escapeHtml(err.message || String(err)) + '</div>';
    }).getClients(true);
  }

  function setClientActive_(clientId, fnName) {
    google.script.run.withSuccessHandler(function () {
      loadClients();
      loadClientsForTripForm();
    }).withFailureHandler(function (err) {
      alert(err.message || String(err));
    })[fnName](clientId);
  }

  function startEditClient(client) {
    STATE.editingClientId = client.id;
    $('client-form-title').textContent = 'Edit client';
    $('client-id').value = client.id;
    $('client-name').value = client.name;
    $('client-contact').value = client.contactPerson;
    $('client-phone').value = client.phone;
    $('client-email').value = client.email;
    $('client-address').value = client.address;
    $('client-submit').textContent = 'Save changes';
    $('client-cancel-edit').hidden = false;
    $('client-form').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function resetClientForm() {
    STATE.editingClientId = null;
    $('client-form-title').textContent = 'Add client';
    $('client-form').reset();
    $('client-id').value = '';
    $('client-submit').textContent = 'Add client';
    $('client-cancel-edit').hidden = true;
  }

  $('client-cancel-edit').addEventListener('click', resetClientForm);

  $('client-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('client-submit');
    var msg = $('client-msg');
    clearMsg(msg);
    btn.disabled = true;

    var clientData = {
      name: $('client-name').value,
      contactPerson: $('client-contact').value,
      phone: $('client-phone').value,
      email: $('client-email').value,
      address: $('client-address').value
    };

    var onDone = function () {
      btn.disabled = false;
      showMsg(msg, STATE.editingClientId ? 'Client updated.' : 'Client added.', false);
      resetClientForm();
      loadClients();
      loadClientsForTripForm();
    };
    var onFail = function (err) {
      btn.disabled = false;
      showMsg(msg, err.message || String(err), true);
    };

    if (STATE.editingClientId) {
      google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail)
        .updateClient(STATE.editingClientId, clientData);
    } else {
      google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail)
        .addClient(clientData);
    }
  });

  /* ---------- Load Bringers ---------- */

  function loadLoadBringersForTripForm() {
    google.script.run.withSuccessHandler(function (bringers) {
      var select = $('trip-load-bringer');
      select.innerHTML = '<option value="">None</option>' +
        bringers.map(function (b) { return '<option value="' + escapeHtml(b.id) + '">' + escapeHtml(b.name) + '</option>'; }).join('');
    }).withFailureHandler(function (err) {
      showMsg($('trip-msg'), err.message || String(err), true);
    }).getLoadBringers(false);
  }

  function loadLoadBringers() {
    var wrap = $('bringers-table-wrap');
    google.script.run.withSuccessHandler(function (bringers) {
      if (!bringers.length) {
        wrap.innerHTML = '<div class="empty-state">No load bringers yet. Add one above.</div>';
        return;
      }
      var rows = bringers.map(function (b) {
        return '<tr>' +
          '<td>' + escapeHtml(b.name) + '</td>' +
          '<td>' + escapeHtml(b.phone) + '</td>' +
          '<td><span class="badge ' + (b.active ? 'ok' : 'neutral') + '">' + (b.active ? 'Active' : 'Inactive') + '</span></td>' +
          '<td>' + b.tripCount + '</td>' +
          '<td><strong>' + money(b.totalPaid) + '</strong></td>' +
          '<td>' +
            '<button class="btn sm ghost" data-edit="' + escapeHtml(b.id) + '">Edit</button> ' +
            (b.active
              ? '<button class="btn sm danger" data-deactivate="' + escapeHtml(b.id) + '">Deactivate</button>'
              : '<button class="btn sm" data-reactivate="' + escapeHtml(b.id) + '">Reactivate</button>') +
          '</td>' +
          '</tr>';
      }).join('');
      wrap.innerHTML = '<table><thead><tr><th>Name</th><th>Phone</th><th>Status</th><th>Loads brought</th><th>Total paid</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>';

      wrap.querySelectorAll('[data-edit]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var bringer = bringers.filter(function (b) { return b.id === btn.getAttribute('data-edit'); })[0];
          if (bringer) startEditLoadBringer(bringer);
        });
      });
      wrap.querySelectorAll('[data-deactivate]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (!confirm('Deactivate this load bringer? Past trips are kept.')) return;
          setLoadBringerActive_(btn.getAttribute('data-deactivate'), 'deactivateLoadBringer');
        });
      });
      wrap.querySelectorAll('[data-reactivate]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          setLoadBringerActive_(btn.getAttribute('data-reactivate'), 'reactivateLoadBringer');
        });
      });
    }).withFailureHandler(function (err) {
      wrap.innerHTML = '<div class="empty-state">' + escapeHtml(err.message || String(err)) + '</div>';
    }).getLoadBringerSummary();
  }

  function setLoadBringerActive_(loadBringerId, fnName) {
    google.script.run.withSuccessHandler(function () {
      loadLoadBringers();
      loadLoadBringersForTripForm();
    }).withFailureHandler(function (err) {
      alert(err.message || String(err));
    })[fnName](loadBringerId);
  }

  function startEditLoadBringer(bringer) {
    STATE.editingLoadBringerId = bringer.id;
    $('bringer-form-title').textContent = 'Edit load bringer';
    $('bringer-id').value = bringer.id;
    $('bringer-name').value = bringer.name;
    $('bringer-phone').value = bringer.phone;
    $('bringer-submit').textContent = 'Save changes';
    $('bringer-cancel-edit').hidden = false;
    $('bringer-form').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function resetLoadBringerForm() {
    STATE.editingLoadBringerId = null;
    $('bringer-form-title').textContent = 'Add load bringer';
    $('bringer-form').reset();
    $('bringer-id').value = '';
    $('bringer-submit').textContent = 'Add load bringer';
    $('bringer-cancel-edit').hidden = true;
  }

  $('bringer-cancel-edit').addEventListener('click', resetLoadBringerForm);

  $('bringer-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('bringer-submit');
    var msg = $('bringer-msg');
    clearMsg(msg);
    btn.disabled = true;

    var bringerData = {
      name: $('bringer-name').value,
      phone: $('bringer-phone').value
    };

    var onDone = function () {
      btn.disabled = false;
      showMsg(msg, STATE.editingLoadBringerId ? 'Load bringer updated.' : 'Load bringer added.', false);
      resetLoadBringerForm();
      loadLoadBringers();
      loadLoadBringersForTripForm();
    };
    var onFail = function (err) {
      btn.disabled = false;
      showMsg(msg, err.message || String(err), true);
    };

    if (STATE.editingLoadBringerId) {
      google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail)
        .updateLoadBringer(STATE.editingLoadBringerId, bringerData);
    } else {
      google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail)
        .addLoadBringer(bringerData);
    }
  });

  /* ---------- New Trip ---------- */

  function prefillTripFeesFromSettings() {
    if (!STATE.settings) return;
    $('trip-toll').value = STATE.settings.defaultTollFee;
    $('trip-zrp').value = STATE.settings.defaultZrpFee;
    $('trip-vid').value = STATE.settings.defaultVidFee;
  }

  $('trip-client-name').addEventListener('input', function () {
    var typed = this.value.trim().toLowerCase();
    var match = STATE.clients.filter(function (c) { return c.name.trim().toLowerCase() === typed; })[0];
    var hint = $('trip-client-match-hint');
    if (!typed) {
      hint.textContent = 'Type a name — matches an existing client, or adds a new one';
    } else if (match) {
      hint.textContent = 'Existing client' + (match.phone ? ' — phone on file: ' + match.phone : '');
      if (match.phone && !$('trip-client-phone').value) {
        $('trip-client-phone').value = match.phone;
      }
    } else {
      hint.textContent = 'New client — will be added to the client list when this trip is saved';
    }
  });

  $('trip-discount-toggle').addEventListener('click', function () {
    var fields = $('trip-discount-fields');
    var showing = !fields.hidden;
    if (showing) {
      $('trip-discount-amount').value = 0;
      $('trip-discount-reason').value = '';
    }
    fields.hidden = showing;
    this.textContent = showing ? '+ Add discount' : '- Remove discount';
    updateTripPreview();
  });

  function updateTripPreview() {
    if (!STATE.settings) return;
    var distance = Number($('trip-distance').value) || 0;
    var toll = Number($('trip-toll').value) || 0;
    var zrp = Number($('trip-zrp').value) || 0;
    var vid = Number($('trip-vid').value) || 0;
    var other = Number($('trip-other-amount').value) || 0;
    var loadBringerId = $('trip-load-bringer').value;
    var loadBringerName = loadBringerId ? $('trip-load-bringer').selectedOptions[0].textContent : '';
    var discountShown = !$('trip-discount-fields').hidden;
    var discount = discountShown ? (Number($('trip-discount-amount').value) || 0) : 0;

    var roundTrip = distance * 2;
    var fuelRate = STATE.settings.fuelConsumptionKmPerL > 0
      ? STATE.settings.fuelPricePerLitre / STATE.settings.fuelConsumptionKmPerL
      : 0;
    var fuelCost = roundTrip * fuelRate;
    var tripExpenses = toll + zrp + vid + other;
    var subtotal = fuelCost + tripExpenses;
    var marginPercent = STATE.settings.companyMarginPercent;
    var marginAmount = subtotal * marginPercent / 100;
    var levyAmount = loadBringerId ? STATE.settings.loadLevyAmount : 0;
    var totalBeforeDiscount = subtotal + marginAmount + levyAmount;
    var total = totalBeforeDiscount - discount;

    $('cs-distance').textContent = roundTrip.toFixed(2) + ' km';
    $('cs-fuel-rate').textContent = money(fuelRate) + ' / km';
    $('cs-fuel').textContent = money(fuelCost);
    $('cs-expenses').textContent = money(tripExpenses);
    $('cs-subtotal').textContent = money(subtotal);
    $('cs-margin-label').textContent = 'Margin (' + marginPercent + '%)';
    $('cs-margin').textContent = money(marginAmount);

    $('cs-levy-row').hidden = !loadBringerId;
    if (loadBringerId) {
      $('cs-levy-label').textContent = 'Load levy (' + loadBringerName + ')';
      $('cs-levy').textContent = money(levyAmount);
    }

    $('cs-before-discount-row').hidden = !(discount > 0);
    if (discount > 0) $('cs-before-discount').textContent = money(totalBeforeDiscount);
    $('cs-discount-row').hidden = !(discount > 0);
    if (discount > 0) $('cs-discount').textContent = '−' + money(discount);

    $('cs-total').textContent = money(total);
  }

  ['trip-distance', 'trip-toll', 'trip-zrp', 'trip-vid', 'trip-other-amount', 'trip-load-bringer', 'trip-discount-amount'].forEach(function (id) {
    $(id).addEventListener('input', updateTripPreview);
    $(id).addEventListener('change', updateTripPreview);
  });

  $('trip-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('trip-submit');
    var msg = $('trip-msg');
    clearMsg(msg);

    if (!$('trip-client-name').value.trim()) {
      showMsg(msg, 'Enter a client name before quoting a trip.', true);
      return;
    }

    btn.disabled = true;

    var discountShown = !$('trip-discount-fields').hidden;

    google.script.run.withSuccessHandler(function (result) {
      btn.disabled = false;
      showMsg(msg, 'Trip saved - quote total ' + money(result.trip.totalCost) + '.', false);
      $('trip-form').reset();
      $('trip-discount-fields').hidden = true;
      $('trip-discount-toggle').textContent = '+ Add discount';
      $('trip-client-match-hint').textContent = 'Type a name — matches an existing client, or adds a new one';
      prefillTripFeesFromSettings();
      updateTripPreview();
      loadClientsForTripForm();
    }).withFailureHandler(function (err) {
      btn.disabled = false;
      showMsg(msg, err.message || String(err), true);
    }).saveTrip({
      clientName: $('trip-client-name').value,
      clientPhone: $('trip-client-phone').value,
      destination: $('trip-destination').value,
      oneWayDistanceKm: Number($('trip-distance').value),
      tollFee: Number($('trip-toll').value) || 0,
      zrpFee: Number($('trip-zrp').value) || 0,
      vidFee: Number($('trip-vid').value) || 0,
      otherFeesDescription: $('trip-other-desc').value,
      otherFeesAmount: Number($('trip-other-amount').value) || 0,
      loadBringerId: $('trip-load-bringer').value,
      discountAmount: discountShown ? (Number($('trip-discount-amount').value) || 0) : 0,
      discountReason: discountShown ? $('trip-discount-reason').value : '',
      notes: $('trip-notes').value
    });
  });

  /* ---------- Trip History ---------- */

  function loadTripHistory() {
    var wrap = $('history-table-wrap');
    var sub = $('history-sub');
    google.script.run.withSuccessHandler(function (trips) {
      sub.textContent = trips.length + ' trip' + (trips.length === 1 ? '' : 's') + ' quoted.';
      if (!trips.length) {
        wrap.innerHTML = '<div class="empty-state">No trips quoted yet.</div>';
        return;
      }
      var rows = trips.map(function (t) {
        return '<tr>' +
          '<td>' + new Date(t.tripDate).toLocaleDateString() + '</td>' +
          '<td>' + escapeHtml(t.clientName) + '</td>' +
          '<td>' + escapeHtml(t.destination) + '</td>' +
          '<td>' + t.roundTripDistanceKm.toFixed(2) + ' km</td>' +
          '<td>' + money(t.fuelCost) + '</td>' +
          '<td>' + money(t.tripExpenses) + '</td>' +
          '<td>' + money(t.marginAmount) + ' (' + t.marginPercent + '%)</td>' +
          '<td>' + (t.loadBringerName ? escapeHtml(t.loadBringerName) + ' (' + money(t.loadLevyAmount) + ')' : '&mdash;') + '</td>' +
          '<td>' + (t.discountAmount > 0 ? '−' + money(t.discountAmount) : '&mdash;') + '</td>' +
          '<td><strong>' + money(t.totalCost) + '</strong></td>' +
          '</tr>';
      }).join('');
      wrap.innerHTML = '<table><thead><tr><th>Date</th><th>Client</th><th>Destination</th><th>Round trip</th><th>Fuel</th><th>Expenses</th><th>Margin</th><th>Load bringer (levy)</th><th>Discount</th><th>Quote</th></tr></thead><tbody>' + rows + '</tbody></table>';
    }).withFailureHandler(function (err) {
      wrap.innerHTML = '<div class="empty-state">' + escapeHtml(err.message || String(err)) + '</div>';
    }).getTrips({});
  }

  /* ---------- Accounting ---------- */

  function loadAccounting() {
    google.script.run.withSuccessHandler(renderAccountingSummary).withFailureHandler(function (err) {
      $('acct-sub').textContent = err.message || String(err);
    }).getAccountingSummary();

    var wrap = $('acct-ledger-wrap');
    google.script.run.withSuccessHandler(function (trips) {
      if (!trips.length) {
        wrap.innerHTML = '<div class="empty-state">No trips yet.</div>';
        return;
      }
      var rows = trips.map(function (t) {
        var net = t.marginAmount - t.discountAmount;
        return '<tr>' +
          '<td>' + new Date(t.tripDate).toLocaleDateString() + '</td>' +
          '<td>' + escapeHtml(t.clientName) + '</td>' +
          '<td>' + money(t.totalCost) + '</td>' +
          '<td>' + money(t.fuelCost) + '</td>' +
          '<td>' + money(t.tripExpenses) + '</td>' +
          '<td>' + (t.loadLevyAmount > 0 ? money(t.loadLevyAmount) : '&mdash;') + '</td>' +
          '<td><strong>' + money(net) + '</strong></td>' +
          '</tr>';
      }).join('');
      wrap.innerHTML = '<table><thead><tr><th>Date</th><th>Client</th><th>Income</th><th>Fuel</th><th>Trip expenses</th><th>Load levy</th><th>Net</th></tr></thead><tbody>' + rows + '</tbody></table>';
    }).withFailureHandler(function (err) {
      wrap.innerHTML = '<div class="empty-state">' + escapeHtml(err.message || String(err)) + '</div>';
    }).getTrips({});
  }

  function renderAccountingSummary(summary) {
    $('acct-sub').textContent = summary.tripCount + ' trip' + (summary.tripCount === 1 ? '' : 's') +
      ' — income and expenses, derived automatically from trips as they\'re saved.';

    $('acct-income').textContent = money(summary.totalIncome);
    $('acct-expenses').textContent = money(summary.totalExpenses);

    var netEl = $('acct-net');
    netEl.textContent = money(summary.netProfit);
    netEl.classList.remove('positive', 'negative');
    netEl.classList.add(summary.netProfit >= 0 ? 'positive' : 'negative');

    $('acct-fuel').textContent = money(summary.totalFuelExpense);
    $('acct-trip-expenses').textContent = money(summary.totalTripExpenses);
    $('acct-levies').textContent = money(summary.totalLoadLevyPaid);
    $('acct-discounts').textContent = summary.totalDiscountsGiven > 0 ? '−' + money(summary.totalDiscountsGiven) : '—';
  }

  /* ---------- Trends ---------- */

  function loadTrends() {
    var ids = ['trend-revenue-chart', 'trend-trips-chart', 'trend-clients-chart', 'trend-bringers-chart'];
    google.script.run.withSuccessHandler(function (data) {
      $('trend-revenue-chart').innerHTML = svgDualBars_(data.dailyTrend, 'revenue', 'profit');
      $('trend-trips-chart').innerHTML = svgSingleBars_(data.dailyTrend, 'tripCount', 'var(--brand-blue)', function (v) { return String(v); });
      $('trend-clients-chart').innerHTML = data.topClients.length
        ? svgRankedBars_(data.topClients, 'revenue', 'name', money, 'var(--brand-blue)')
        : '<div class="empty-state">No trips yet.</div>';
      $('trend-bringers-chart').innerHTML = data.topLoadBringers.length
        ? svgRankedBars_(data.topLoadBringers, 'tripCount', 'name', function (v) { return v + (v === 1 ? ' load' : ' loads'); }, 'var(--brand-orange)')
        : '<div class="empty-state">No load bringers recorded yet.</div>';
    }).withFailureHandler(function (err) {
      ids.forEach(function (id) { $(id).innerHTML = '<div class="empty-state">' + escapeHtml(err.message || String(err)) + '</div>'; });
    }).getTrendsData();
  }

  /** Two bars per day (revenue, profit), rounded corners, a thin stroke so the
   *  shape reads even at low fill-vs-background contrast, and a value label
   *  on the most recent day only. */
  function svgDualBars_(days, keyA, keyB) {
    var w = 700, barAreaH = 150, h = barAreaH + 26;
    var maxVal = Math.max(1, Math.max.apply(null, days.map(function (d) { return Math.max(d[keyA], d[keyB]); })));
    var slotW = w / days.length;
    var barW = Math.max(4, Math.min(14, slotW / 2 - 3));

    var svg = '<svg class="chart-svg" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="Revenue and profit, last 14 days">';
    svg += '<line x1="0" y1="' + barAreaH + '" x2="' + w + '" y2="' + barAreaH + '" stroke="var(--line-strong)" stroke-width="1"/>';

    days.forEach(function (d, i) {
      var cx = i * slotW + slotW / 2;
      var aH = Math.max(1, Math.round((d[keyA] / maxVal) * (barAreaH - 14)));
      var bH = Math.max(1, Math.round((d[keyB] / maxVal) * (barAreaH - 14)));
      var isLast = i === days.length - 1;

      svg += barRect_(cx - barW - 1, barAreaH - aH, barW, aH, 'var(--brand-blue)', d.label + ': ' + money(d[keyA]) + ' revenue');
      svg += barRect_(cx + 1, barAreaH - bH, barW, bH, 'var(--brand-orange)', d.label + ': ' + money(d[keyB]) + ' profit');

      if (isLast) {
        svg += svgText_(cx, barAreaH - Math.max(aH, bH) - 6, money(d[keyA]), 'var(--ink-2)');
      }
      if (i % 2 === 0 || isLast) {
        svg += svgText_(cx, barAreaH + 16, d.label, 'var(--ink-4)');
      }
    });

    return svg + '</svg>';
  }

  /** One bar per day. */
  function svgSingleBars_(days, key, color, formatFn) {
    var w = 700, barAreaH = 120, h = barAreaH + 26;
    var maxVal = Math.max(1, Math.max.apply(null, days.map(function (d) { return d[key]; })));
    var slotW = w / days.length;
    var barW = Math.max(6, Math.min(20, slotW - 6));

    var svg = '<svg class="chart-svg" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="Daily trend">';
    svg += '<line x1="0" y1="' + barAreaH + '" x2="' + w + '" y2="' + barAreaH + '" stroke="var(--line-strong)" stroke-width="1"/>';

    days.forEach(function (d, i) {
      var cx = i * slotW + slotW / 2;
      var barH = Math.max(1, Math.round((d[key] / maxVal) * (barAreaH - 14)));
      var isLast = i === days.length - 1;

      svg += barRect_(cx - barW / 2, barAreaH - barH, barW, barH, color, d.label + ': ' + formatFn(d[key]));
      if (isLast) svg += svgText_(cx, barAreaH - barH - 6, formatFn(d[key]), 'var(--ink-2)');
      if (i % 2 === 0 || isLast) svg += svgText_(cx, barAreaH + 16, d.label, 'var(--ink-4)');
    });

    return svg + '</svg>';
  }

  /** Horizontal ranked bars - label + value always shown directly, since a
   *  ranked list reads as numbers as much as shape. */
  function svgRankedBars_(items, valueKey, labelKey, formatFn, color) {
    var w = 700, rowH = 28, h = items.length * rowH + 8;
    var maxVal = Math.max(1, Math.max.apply(null, items.map(function (it) { return it[valueKey]; })));
    var labelW = 170, barAreaW = w - labelW - 70;

    var svg = '<svg class="chart-svg" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="Ranked totals">';
    items.forEach(function (it, i) {
      var y = i * rowH + 6;
      var barW = Math.max(2, Math.round((it[valueKey] / maxVal) * barAreaW));
      svg += '<text x="' + (labelW - 8) + '" y="' + (y + 13) + '" text-anchor="end" font-size="11" fill="var(--ink-1)">' + escapeHtml(it[labelKey]) + '</text>';
      svg += barRect_(labelW, y, barW, 16, color, it[labelKey] + ': ' + formatFn(it[valueKey]));
      svg += '<text x="' + (labelW + barW + 6) + '" y="' + (y + 13) + '" font-size="11" fill="var(--ink-2)">' + escapeHtml(formatFn(it[valueKey])) + '</text>';
    });

    return svg + '</svg>';
  }

  function barRect_(x, y, w, h, color, titleText) {
    return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="2" ' +
      'fill="' + color + '" stroke="var(--ink-2)" stroke-width="0.5">' +
      '<title>' + escapeHtml(titleText) + '</title></rect>';
  }

  function svgText_(x, y, text, color) {
    return '<text x="' + x + '" y="' + y + '" text-anchor="middle" font-size="9" fill="' + color + '">' + escapeHtml(text) + '</text>';
  }

  loadInitialData();
</script>
