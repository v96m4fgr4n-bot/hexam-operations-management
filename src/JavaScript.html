<script>
  var STATE = { settings: null, clients: [], editingClientId: null };

  function $(id) { return document.getElementById(id); }

  function escapeHtml(s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function money(n) {
    var symbol = (STATE.settings && STATE.settings.currencySymbol) || '$';
    return symbol + Number(n || 0).toFixed(2);
  }

  function showMsg(el, text, isError) {
    el.textContent = text;
    el.className = 'msg ' + (isError ? 'error' : 'success');
  }

  function clearMsg(el) {
    el.textContent = '';
    el.className = 'msg';
  }

  /* ---------- Sidebar navigation ---------- */

  function setView(viewName) {
    document.querySelectorAll('.nav-item').forEach(function (item) {
      item.classList.toggle('active', item.getAttribute('data-view') === viewName);
    });
    document.querySelectorAll('.view').forEach(function (view) {
      view.classList.toggle('active', view.id === 'view-' + viewName);
    });
    closeSidebar();

    if (viewName === 'trip-history') loadTripHistory();
    if (viewName === 'clients') loadClients();
  }

  function openSidebar() {
    $('sidebar').classList.add('open');
    $('sidebar-backdrop').classList.add('open');
  }

  function closeSidebar() {
    $('sidebar').classList.remove('open');
    $('sidebar-backdrop').classList.remove('open');
  }

  document.querySelectorAll('.nav-item').forEach(function (item) {
    item.addEventListener('click', function () { setView(item.getAttribute('data-view')); });
    item.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setView(item.getAttribute('data-view')); }
    });
  });

  $('burger').addEventListener('click', openSidebar);
  $('sidebar-backdrop').addEventListener('click', closeSidebar);

  /* ---------- Bootstrap ---------- */

  function loadInitialData() {
    google.script.run.withSuccessHandler(function (settings) {
      STATE.settings = settings;
      populateSettingsForm(settings);
      prefillTripFeesFromSettings();
      updateTripPreview();
    }).withFailureHandler(function (err) {
      showMsg($('trip-msg'), err.message || String(err), true);
    }).getSettings();

    loadClientsForTripForm();
  }

  /* ---------- Settings ---------- */

  function populateSettingsForm(settings) {
    $('settings-fuel-price').value = settings.fuelPricePerLitre;
    $('settings-fuel-consumption').value = settings.fuelConsumptionLPerKm;
    $('settings-fuel-rate-preview').value = money(settings.fuelPricePerLitre * settings.fuelConsumptionLPerKm) + ' / km';
    $('settings-currency').value = settings.currencySymbol;
    $('settings-toll').value = settings.defaultTollFee;
    $('settings-zrp').value = settings.defaultZrpFee;
    $('settings-vid').value = settings.defaultVidFee;
    $('settings-margin').value = settings.companyMarginPercent;
  }

  ['settings-fuel-price', 'settings-fuel-consumption'].forEach(function (id) {
    $(id).addEventListener('input', function () {
      var price = Number($('settings-fuel-price').value) || 0;
      var consumption = Number($('settings-fuel-consumption').value) || 0;
      $('settings-fuel-rate-preview').value = money(price * consumption) + ' / km';
    });
  });

  $('settings-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('settings-submit');
    var msg = $('settings-msg');
    clearMsg(msg);
    btn.disabled = true;

    google.script.run.withSuccessHandler(function (result) {
      btn.disabled = false;
      STATE.settings = result.settings;
      populateSettingsForm(result.settings);
      showMsg(msg, 'Settings saved.', false);
      updateTripPreview();
      prefillTripFeesFromSettings();
    }).withFailureHandler(function (err) {
      btn.disabled = false;
      showMsg(msg, err.message || String(err), true);
    }).updateSettings({
      fuelPricePerLitre: Number($('settings-fuel-price').value),
      fuelConsumptionLPerKm: Number($('settings-fuel-consumption').value),
      currencySymbol: $('settings-currency').value,
      defaultTollFee: Number($('settings-toll').value),
      defaultZrpFee: Number($('settings-zrp').value),
      defaultVidFee: Number($('settings-vid').value),
      companyMarginPercent: Number($('settings-margin').value)
    });
  });

  /* ---------- Clients ---------- */

  function loadClientsForTripForm() {
    google.script.run.withSuccessHandler(function (clients) {
      STATE.clients = clients;
      var select = $('trip-client');
      select.innerHTML = clients.length
        ? clients.map(function (c) { return '<option value="' + escapeHtml(c.id) + '">' + escapeHtml(c.name) + '</option>'; }).join('')
        : '<option value="">No active clients - add one first</option>';
    }).withFailureHandler(function (err) {
      showMsg($('trip-msg'), err.message || String(err), true);
    }).getClients(false);
  }

  function loadClients() {
    var wrap = $('clients-table-wrap');
    google.script.run.withSuccessHandler(function (clients) {
      if (!clients.length) {
        wrap.innerHTML = '<div class="empty-state">No clients yet. Add one above.</div>';
        return;
      }
      var rows = clients.map(function (c) {
        return '<tr>' +
          '<td>' + escapeHtml(c.name) + '</td>' +
          '<td>' + escapeHtml(c.contactPerson) + '</td>' +
          '<td>' + escapeHtml(c.phone) + '</td>' +
          '<td>' + escapeHtml(c.email) + '</td>' +
          '<td><span class="badge ' + (c.active ? 'ok' : 'neutral') + '">' + (c.active ? 'Active' : 'Inactive') + '</span></td>' +
          '<td>' +
            '<button class="btn sm ghost" data-edit="' + escapeHtml(c.id) + '">Edit</button> ' +
            (c.active
              ? '<button class="btn sm danger" data-deactivate="' + escapeHtml(c.id) + '">Deactivate</button>'
              : '<button class="btn sm" data-reactivate="' + escapeHtml(c.id) + '">Reactivate</button>') +
          '</td>' +
          '</tr>';
      }).join('');
      wrap.innerHTML = '<table><thead><tr><th>Name</th><th>Contact</th><th>Phone</th><th>Email</th><th>Status</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>';

      wrap.querySelectorAll('[data-edit]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var client = clients.filter(function (c) { return c.id === btn.getAttribute('data-edit'); })[0];
          if (client) startEditClient(client);
        });
      });
      wrap.querySelectorAll('[data-deactivate]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (!confirm('Deactivate this client? Past trips are kept.')) return;
          setClientActive_(btn.getAttribute('data-deactivate'), 'deactivateClient');
        });
      });
      wrap.querySelectorAll('[data-reactivate]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          setClientActive_(btn.getAttribute('data-reactivate'), 'reactivateClient');
        });
      });
    }).withFailureHandler(function (err) {
      wrap.innerHTML = '<div class="empty-state">' + escapeHtml(err.message || String(err)) + '</div>';
    }).getClients(true);
  }

  function setClientActive_(clientId, fnName) {
    google.script.run.withSuccessHandler(function () {
      loadClients();
      loadClientsForTripForm();
    }).withFailureHandler(function (err) {
      alert(err.message || String(err));
    })[fnName](clientId);
  }

  function startEditClient(client) {
    STATE.editingClientId = client.id;
    $('client-form-title').textContent = 'Edit client';
    $('client-id').value = client.id;
    $('client-name').value = client.name;
    $('client-contact').value = client.contactPerson;
    $('client-phone').value = client.phone;
    $('client-email').value = client.email;
    $('client-address').value = client.address;
    $('client-submit').textContent = 'Save changes';
    $('client-cancel-edit').hidden = false;
    $('client-form').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function resetClientForm() {
    STATE.editingClientId = null;
    $('client-form-title').textContent = 'Add client';
    $('client-form').reset();
    $('client-id').value = '';
    $('client-submit').textContent = 'Add client';
    $('client-cancel-edit').hidden = true;
  }

  $('client-cancel-edit').addEventListener('click', resetClientForm);

  $('client-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('client-submit');
    var msg = $('client-msg');
    clearMsg(msg);
    btn.disabled = true;

    var clientData = {
      name: $('client-name').value,
      contactPerson: $('client-contact').value,
      phone: $('client-phone').value,
      email: $('client-email').value,
      address: $('client-address').value
    };

    var onDone = function () {
      btn.disabled = false;
      showMsg(msg, STATE.editingClientId ? 'Client updated.' : 'Client added.', false);
      resetClientForm();
      loadClients();
      loadClientsForTripForm();
    };
    var onFail = function (err) {
      btn.disabled = false;
      showMsg(msg, err.message || String(err), true);
    };

    if (STATE.editingClientId) {
      google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail)
        .updateClient(STATE.editingClientId, clientData);
    } else {
      google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail)
        .addClient(clientData);
    }
  });

  /* ---------- New Trip ---------- */

  function prefillTripFeesFromSettings() {
    if (!STATE.settings) return;
    $('trip-toll').value = STATE.settings.defaultTollFee;
    $('trip-zrp').value = STATE.settings.defaultZrpFee;
    $('trip-vid').value = STATE.settings.defaultVidFee;
  }

  function updateTripPreview() {
    if (!STATE.settings) return;
    var distance = Number($('trip-distance').value) || 0;
    var toll = Number($('trip-toll').value) || 0;
    var zrp = Number($('trip-zrp').value) || 0;
    var vid = Number($('trip-vid').value) || 0;
    var other = Number($('trip-other-amount').value) || 0;

    var roundTrip = distance * 2;
    var fuelRate = STATE.settings.fuelPricePerLitre * STATE.settings.fuelConsumptionLPerKm;
    var fuelCost = roundTrip * fuelRate;
    var tripExpenses = toll + zrp + vid + other;
    var subtotal = fuelCost + tripExpenses;
    var marginPercent = STATE.settings.companyMarginPercent;
    var marginAmount = subtotal * marginPercent / 100;
    var total = subtotal + marginAmount;

    $('cs-distance').textContent = roundTrip.toFixed(2) + ' km';
    $('cs-fuel-rate').textContent = money(fuelRate) + ' / km';
    $('cs-fuel').textContent = money(fuelCost);
    $('cs-expenses').textContent = money(tripExpenses);
    $('cs-subtotal').textContent = money(subtotal);
    $('cs-margin-label').textContent = 'Margin (' + marginPercent + '%)';
    $('cs-margin').textContent = money(marginAmount);
    $('cs-total').textContent = money(total);
  }

  ['trip-distance', 'trip-toll', 'trip-zrp', 'trip-vid', 'trip-other-amount'].forEach(function (id) {
    $(id).addEventListener('input', updateTripPreview);
  });

  $('trip-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('trip-submit');
    var msg = $('trip-msg');
    clearMsg(msg);

    if (!$('trip-client').value) {
      showMsg(msg, 'Add a client before quoting a trip.', true);
      return;
    }

    btn.disabled = true;

    google.script.run.withSuccessHandler(function (result) {
      btn.disabled = false;
      showMsg(msg, 'Trip saved - quote total ' + money(result.trip.totalCost) + '.', false);
      $('trip-form').reset();
      prefillTripFeesFromSettings();
      updateTripPreview();
    }).withFailureHandler(function (err) {
      btn.disabled = false;
      showMsg(msg, err.message || String(err), true);
    }).saveTrip({
      clientId: $('trip-client').value,
      destination: $('trip-destination').value,
      oneWayDistanceKm: Number($('trip-distance').value),
      tollFee: Number($('trip-toll').value) || 0,
      zrpFee: Number($('trip-zrp').value) || 0,
      vidFee: Number($('trip-vid').value) || 0,
      otherFeesDescription: $('trip-other-desc').value,
      otherFeesAmount: Number($('trip-other-amount').value) || 0,
      notes: $('trip-notes').value
    });
  });

  /* ---------- Trip History ---------- */

  function loadTripHistory() {
    var wrap = $('history-table-wrap');
    var sub = $('history-sub');
    google.script.run.withSuccessHandler(function (trips) {
      sub.textContent = trips.length + ' trip' + (trips.length === 1 ? '' : 's') + ' quoted.';
      if (!trips.length) {
        wrap.innerHTML = '<div class="empty-state">No trips quoted yet.</div>';
        return;
      }
      var rows = trips.map(function (t) {
        return '<tr>' +
          '<td>' + new Date(t.tripDate).toLocaleDateString() + '</td>' +
          '<td>' + escapeHtml(t.clientName) + '</td>' +
          '<td>' + escapeHtml(t.destination) + '</td>' +
          '<td>' + t.roundTripDistanceKm.toFixed(2) + ' km</td>' +
          '<td>' + money(t.fuelCost) + '</td>' +
          '<td>' + money(t.tripExpenses) + '</td>' +
          '<td>' + money(t.marginAmount) + ' (' + t.marginPercent + '%)</td>' +
          '<td><strong>' + money(t.totalCost) + '</strong></td>' +
          '</tr>';
      }).join('');
      wrap.innerHTML = '<table><thead><tr><th>Date</th><th>Client</th><th>Destination</th><th>Round trip</th><th>Fuel</th><th>Expenses</th><th>Margin</th><th>Quote</th></tr></thead><tbody>' + rows + '</tbody></table>';
    }).withFailureHandler(function (err) {
      wrap.innerHTML = '<div class="empty-state">' + escapeHtml(err.message || String(err)) + '</div>';
    }).getTrips({});
  }

  loadInitialData();
</script>
