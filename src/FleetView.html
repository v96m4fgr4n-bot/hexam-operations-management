<div class="page-head">
  <div>
    <h1 class="page-title">Fleet</h1>
    <p class="page-sub">Trucks, trailers, roadworthy/service dates, and driver assignments.</p>
  </div>
  <div style="display:flex; gap:8px; flex-wrap:wrap;">
    <button type="button" class="btn primary" id="truck-add-btn">+ Add truck</button>
    <button type="button" class="btn primary" id="trailer-add-btn">+ Add trailer</button>
    <button type="button" class="btn primary" id="driver-add-btn">+ Add driver</button>
  </div>
</div>

<div class="card hero-card" id="fleet-hero" aria-busy="true">
  <div class="hero-card-main">
    <div class="hero-figure" id="fleet-attention-count">-</div>
    <div class="hero-caption" id="fleet-attention-caption">Loading&hellip;</div>
  </div>
  <div class="hero-card-side">
    <div>
      <div class="hero-side-value" id="fleet-truck-count">-</div>
      <div class="hero-side-label">Trucks</div>
    </div>
    <div>
      <div class="hero-side-value" id="fleet-trailer-count">-</div>
      <div class="hero-side-label">Trailers</div>
    </div>
    <div>
      <div class="hero-side-value" id="fleet-driver-count">-</div>
      <div class="hero-side-label">Active drivers</div>
    </div>
  </div>
</div>

<div class="card">
  <h3>All trucks</h3>
  <div class="table-wrap" id="trucks-table-wrap">
    <div class="empty-state">Loading&hellip;</div>
  </div>
</div>

<div class="card">
  <h3>All trailers</h3>
  <div class="table-wrap" id="trailers-table-wrap">
    <div class="empty-state">Loading&hellip;</div>
  </div>
</div>

<div class="card">
  <h3>All drivers</h3>
  <div class="table-wrap" id="drivers-table-wrap">
    <div class="empty-state">Loading&hellip;</div>
  </div>
</div>

<div class="modal-overlay" id="truck-modal">
  <div class="modal-box">
    <div class="page-head" style="margin-bottom:12px;">
      <h3 id="truck-form-title" style="margin:0;">Add truck</h3>
      <button type="button" class="modal-close" id="truck-modal-close" aria-label="Close">&times;</button>
    </div>
    <form id="truck-form">
      <input type="hidden" id="truck-id">
      <div class="form-grid">
        <div class="field">
          <label for="truck-reg">Registration number</label>
          <input id="truck-reg" type="text" required>
        </div>
        <div class="field">
          <label for="truck-roadworthy">Roadworthy certificate expiry</label>
          <input id="truck-roadworthy" type="date">
        </div>
        <div class="field">
          <label for="truck-service">Next service due</label>
          <input id="truck-service" type="date">
        </div>
        <div class="field">
          <label for="truck-status">Status</label>
          <select id="truck-status">
            <option value="Active">Active</option>
            <option value="In Repair">In Repair</option>
            <option value="Offline">Offline</option>
          </select>
        </div>
      </div>
      <button type="submit" class="btn primary" id="truck-submit">Add truck</button>
      <button type="button" class="btn ghost" id="truck-cancel-edit" hidden>Cancel</button>
      <div class="msg" id="truck-msg"></div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="trailer-modal">
  <div class="modal-box">
    <div class="page-head" style="margin-bottom:12px;">
      <h3 id="trailer-form-title" style="margin:0;">Add trailer</h3>
      <button type="button" class="modal-close" id="trailer-modal-close" aria-label="Close">&times;</button>
    </div>
    <form id="trailer-form">
      <input type="hidden" id="trailer-id">
      <div class="form-grid">
        <div class="field">
          <label for="trailer-reg">Registration number</label>
          <input id="trailer-reg" type="text" required>
        </div>
        <div class="field">
          <label for="trailer-roadworthy">Roadworthy certificate expiry</label>
          <input id="trailer-roadworthy" type="date">
        </div>
        <div class="field">
          <label for="trailer-service">Next service due</label>
          <input id="trailer-service" type="date">
        </div>
        <div class="field">
          <label for="trailer-status">Status</label>
          <select id="trailer-status">
            <option value="Active">Active</option>
            <option value="In Repair">In Repair</option>
            <option value="Offline">Offline</option>
          </select>
        </div>
      </div>
      <button type="submit" class="btn primary" id="trailer-submit">Add trailer</button>
      <button type="button" class="btn ghost" id="trailer-cancel-edit" hidden>Cancel</button>
      <div class="msg" id="trailer-msg"></div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="driver-modal">
  <div class="modal-box">
    <div class="page-head" style="margin-bottom:12px;">
      <h3 id="driver-form-title" style="margin:0;">Add driver</h3>
      <button type="button" class="modal-close" id="driver-modal-close" aria-label="Close">&times;</button>
    </div>
    <form id="driver-form">
      <input type="hidden" id="driver-id">
      <div class="form-grid">
        <div class="field">
          <label for="driver-name">Name</label>
          <input id="driver-name" type="text" required>
        </div>
        <div class="field">
          <label for="driver-phone">Phone</label>
          <input id="driver-phone" type="text">
        </div>
        <div class="field">
          <label for="driver-truck">Assigned truck</label>
          <select id="driver-truck">
            <option value="">Unassigned</option>
          </select>
        </div>
      </div>
      <button type="submit" class="btn primary" id="driver-submit">Add driver</button>
      <button type="button" class="btn ghost" id="driver-cancel-edit" hidden>Cancel</button>
      <div class="msg" id="driver-msg"></div>
    </form>
  </div>
</div>
