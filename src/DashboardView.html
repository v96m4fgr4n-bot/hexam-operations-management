<div class="page-head">
  <div>
    <h1 class="page-title">Dashboard</h1>
    <p class="page-sub" id="dash-sub" role="status" aria-live="polite">Loading&hellip;</p>
  </div>
</div>

<div class="card hero-card" id="dash-hero" aria-busy="true">
  <div class="hero-card-main">
    <div class="hero-figure" id="dash-today-profit">-</div>
    <div class="hero-caption">Today's net profit</div>
  </div>
  <div class="hero-card-side">
    <div>
      <div class="hero-side-value" id="dash-today-revenue">-</div>
      <div class="hero-side-label">Revenue today</div>
    </div>
    <div>
      <div class="hero-side-value" id="dash-today-trips">-</div>
      <div class="hero-side-label">Trips today</div>
    </div>
  </div>
</div>

<h3 style="margin-top:18px;">This month</h3>
<div class="form-grid" id="dash-month-grid" aria-busy="true">
  <div class="card stat-card">
    <div class="stat-value" id="dash-month-revenue">-</div>
    <div class="stat-caption">Revenue</div>
  </div>
  <div class="card stat-card">
    <div class="stat-value" id="dash-month-profit">-</div>
    <div class="stat-caption">Net profit</div>
  </div>
  <div class="card stat-card">
    <div class="stat-value" id="dash-month-trips">-</div>
    <div class="stat-caption">Trips</div>
  </div>
</div>

<div class="card" style="margin-top:14px;" id="dash-overall-grid" aria-busy="true">
  <h3>Overall</h3>
  <dl class="breakdown-list">
    <dt>Average quote value</dt><dd id="dash-avg-quote">-</dd>
    <dt>Active clients</dt><dd id="dash-active-clients">-</dd>
    <dt>Active load bringers</dt><dd id="dash-active-bringers">-</dd>
  </dl>
</div>

<div class="card" style="margin-top:14px;">
  <h3>Recent trips</h3>
  <div class="table-wrap" id="dash-recent-wrap">
    <div class="empty-state">Loading&hellip;</div>
  </div>
</div>
